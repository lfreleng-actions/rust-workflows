# =============================================================================
# EXAMPLE: Gerrit-wrapped caller for the Rust merge lane (Model B)
# =============================================================================
# Use this form when Gerrit is the source of truth (SCM) for your project.
# gerrit_to_platform dispatches this workflow (via the GitHub API) when a
# change is MERGED in Gerrit (change-merged event).
#
# This is Model B: the MERGE-DRIVEN release model. Every merge builds,
# tests, audits and scans the merged commit and dry-runs the crates.io
# publish. A release happens when the merged commit adds one file under
# releases/ holding 'version: X.Y.Z'; see github.yaml in this directory.
#
# DEPLOYMENT NOTES:
#   * Copy into .github/workflows/ with a filename containing BOTH 'gerrit'
#     AND 'merge' so gerrit_to_platform can discover it, e.g.
#     gerrit-merge.yaml.
#   * The workflow file must exist on EVERY active branch: dispatches
#     target refs/heads/{GERRIT_BRANCH}.
#   * The nine GERRIT_* inputs are populated automatically by the
#     dispatcher. On merge events GERRIT_PATCHSET_NUMBER is hardcoded "1"
#     and GERRIT_REFSPEC is refs/heads/<branch>.
#   * Merge workflows COMMENT on the change (comment-only) — they never
#     vote; the change already merged.
#   * Tags belong in Gerrit, which replicates them to the mirror, so this
#     caller sets create_tag to false and RelEng tags the release there.
#   * Set the repository variables GERRIT_SERVER, GERRIT_SSH_USER,
#     GERRIT_KNOWN_HOSTS, GERRIT_URL and the secret GERRIT_SSH_PRIVKEY.
# =============================================================================
name: 'Gerrit Merge'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: 'Branch that change is against'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_ID:
        description: 'The ID for the change'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_NUMBER:
        description: 'The Gerrit number'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_URL:
        description: 'URL to the change'
        required: false
        type: string
        default: ''
      GERRIT_EVENT_TYPE:
        description: 'Type of Gerrit event'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_NUMBER:
        description: 'The patch number for the change'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_REVISION:
        description: 'The revision sha'
        required: false
        type: string
        default: ''
      GERRIT_PROJECT:
        description: 'Project in Gerrit'
        required: false
        type: string
        default: ''
      GERRIT_REFSPEC:
        description: 'Gerrit refspec of change'
        required: false
        type: string
        default: ''

# One merge run per branch at a time, in order, and never cancelled: a
# cancelled release could stop between the crates.io upload and the
# tag, and a dropped pending run would lose its merge's release file.
concurrency:
  group: gerrit-merge-${{ github.event.inputs.GERRIT_BRANCH || github.ref }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  # Comment on the merged change so the merge pipeline start is visible
  # in Gerrit (comment-only: the change already merged, so no vote).
  notify:
    name: 'Notify'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - name: 'Notify merge pipeline start'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@1e3eae766b3de755a2e87aa216cedebbaf9c8292  # v1.1.3
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
          comment-only: 'true'
      - name: 'Allow replication'
        run: sleep 10s

  # Call the reusable merge workflow. A reusable workflow cannot raise
  # its caller's permissions, and GitHub checks every nested job's grant
  # when the run starts, so this job grants what the tag and publish
  # jobs declare even though create_tag is false here.
  merge:
    needs: notify
    if: >-
      always()
      && (needs.notify.result == 'success'
          || needs.notify.result == 'skipped')
    permissions:
      contents: write       # Declared by the (disabled) tag job
      id-token: write       # crates.io Trusted Publishing
      pull-requests: read   # repository-metadata-action queries PR data
      issues: read          # grype-scan-action reads cve-bypass issues
    # REPLACE the pinned SHA below with a rust-workflows release SHA.
    # The all-zero SHA is a non-functional placeholder, NOT a real commit.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/rust-workflows/.github/workflows/merge.yaml@0000000000000000000000000000000000000000  # REPLACE: vX.Y.Z
    with:
      gerrit_refspec: ${{ inputs.GERRIT_REFSPEC }}
      gerrit_project: ${{ inputs.GERRIT_PROJECT }}
      gerrit_branch: ${{ inputs.GERRIT_BRANCH }}
      # gerrit_url falls back to the GERRIT_URL repository variable.
      create_tag: false
      # publish_enabled: true
      # publish_environment: 'production-merge'

  # Report the overall workflow conclusion back to Gerrit as a comment
  # (comment-only: merge pipelines never vote).
  report:
    name: 'Report'
    if: always()
    needs: [notify, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: read  # No repository access beyond the default
      actions: read  # workflow-conclusion lists the run's jobs
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - name: 'Get conclusion'
        # yamllint disable-line rule:line-length
        uses: im-open/workflow-conclusion@8eac7f17381a6917bc04fec3e2c92e70ebc37526  # v3.0.0
      - name: 'Report conclusion'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@1e3eae766b3de755a2e87aa216cedebbaf9c8292  # v1.1.3
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: ${{ env.WORKFLOW_CONCLUSION }}
          comment-only: 'true'
