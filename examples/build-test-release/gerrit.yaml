# =============================================================================
# EXAMPLE: Gerrit-sourced caller for the Rust release lane (Model A)
# =============================================================================
# Use this form when Gerrit is the source of truth (SCM) for your project.
#
# This is Model A: the TAG-DRIVEN release model. Unlike the verify
# workflow (which gerrit_to_platform dispatches per patchset and votes
# on), a RELEASE is driven by a tag. For Gerrit projects the release tag
# is pushed to Gerrit and replicated to the GitHub mirror, where it fires
# this standard tag-push event. There is no Gerrit change context on a
# tag, so no votes or comments are cast: this caller is therefore
# near-identical to the GitHub-native release caller (github.yaml), and
# release workflows are tag-triggered ONLY (no workflow_dispatch).
#
# Make this the ONLY workflow in the project that acts on tag pushes.
#
# CRATES.IO TRUSTED PUBLISHING runs from the GitHub mirror: the trusted
# publisher names the mirror repository, this workflow's filename and the
# publish environment. See github.yaml in this directory for the setup
# order; create the environment before the first tag replicates.
# =============================================================================
name: 'Gerrit Release'

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: 'Build/Test/Release'
    # Skip tag deletion events
    if: "!github.event.deleted"
    permissions:
      contents: write       # Draft the GitHub release and attach assets
      id-token: write       # Attestations, Sigstore, Trusted Publishing
      attestations: write   # Build provenance attestations
      pull-requests: read   # repository-metadata-action queries PR data
      issues: read          # grype-scan-action reads cve-bypass issues
    # REPLACE the pinned SHA below with a rust-workflows release SHA.
    # The all-zero SHA is a non-functional placeholder, NOT a real commit.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/rust-workflows/.github/workflows/build-test-release.yaml@0000000000000000000000000000000000000000  # REPLACE: vX.Y.Z
    # All inputs are optional; uncomment to tune.
    # with:
    #   publish_enabled: true
    #   publish_environment: 'production'
    #   attestations: true
    #   sigstore_sign: true
