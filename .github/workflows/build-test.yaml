          set -euo pipefail
          cd "$RUNNER_TEMP"
          scrub=(env -u CARGO_REGISTRY_TOKEN
            -u ACTIONS_ID_TOKEN_REQUEST_TOKEN
            -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN
            -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH
            -u GITHUB_STATE -u GITHUB_STEP_SUMMARY)
          while IFS= read -r name; do
            scrub+=(-u "$name")
          done < <(compgen -e | grep -E '^CARGO_REGISTRIES_.+_TOKEN$' \
            || true)
          "${scrub[@]}" rustup toolchain install "$TOOLCHAIN" \
            --profile minimal --no-self-update
          "${scrub[@]}" RUSTUP_TOOLCHAIN="$TOOLCHAIN" cargo --version

      # The Cargo backend describes the graph cargo resolves for
      # path_prefix: a member's own dependencies, or every member's
      # merged at a workspace root. CycloneDX 1.5, the action's default,
      # is the newest cargo-cyclonedx writes and within the 1.4-1.6
      # range in which grype-scan-action trusts a Cargo graph's scopes.
      #
      # untrusted_checkout is 'false' deliberately. The backend runs
      # cargo, and cargo treats a checkout as code: .cargo/config.toml
      # can name a rustc wrapper that cargo metadata executes. Its
      # 'auto' mode classifies fork pull requests as untrusted and
      # skips, losing the SBOM. That guard buys nothing here: the build
      # job has already compiled this same checkout with the same
      # read-only token.
      # The SBOM describes the workspace root when the lane acts on more
      # than one member (workspace, or named packages), so it covers
      # everything the build does, and the selected manifest's own
      # directory for a single package. Cargo reads .cargo/config.toml
      # from its working directory upwards, and the build runs it in
      # path_prefix, so the SBOM's Cargo runs there too whenever
      # path_prefix lies beneath the described directory. Otherwise
      # Cargo runs in the described directory, which then lies in
      # path_prefix, and its upward search still reaches path_prefix.
      - name: 'Choose the SBOM directories'
        id: dirs
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          # yamllint disable-line rule:line-length
          SCAN_DIR: ${{ (inputs.workspace || inputs.packages != '') && needs.rust-metadata.outputs.lockfile_dir || needs.rust-metadata.outputs.manifest_dir }}
        run: |
          # Choose the SBOM directories
          set -euo pipefail
          case "$PATH_PREFIX$SCAN_DIR" in
            *$'\n'* | *$'\r'*)
              echo "::error::path_prefix holds a line break"
              exit 1 ;;
          esac
          scan="$(realpath -e -- "$GITHUB_WORKSPACE/$SCAN_DIR")"
          prefix="$(realpath -e -- "$GITHUB_WORKSPACE/$PATH_PREFIX")"
          cargo_dir=''
          case "$prefix" in
            "$scan"/*) cargo_dir="$PATH_PREFIX" ;;
          esac
          {
            echo "scan=$SCAN_DIR"
            echo "cargo_dir=$cargo_dir"
          } >> "$GITHUB_OUTPUT"
          echo "SBOM of $SCAN_DIR, Cargo run from ${cargo_dir:-$SCAN_DIR}"

      - name: 'Generate SBOM'
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sbom-action@73cdda97132f74a64733b238747d34151444da15  # v0.7.0
        env:
          RUSTUP_TOOLCHAIN: ${{ needs.rust-metadata.outputs.toolchain }}
        with:
          backend: 'cyclonedx'
          # Named rather than left to 'auto', so the lane states the
          # build tool instead of inferring it.
          dependency_manager: 'cargo'
          path_prefix: ${{ steps.dirs.outputs.scan }}
          cargo_working_directory: ${{ steps.dirs.outputs.cargo_dir }}
          # The build's feature selection, so the SBOM describes the
          # graph the build compiled rather than the default features.
          cargo_features: ${{ inputs.features }}
          cargo_all_features: ${{ inputs.all_features }}
          cargo_no_default_features: ${{ inputs.no_default_features }}
          sbom_format: ${{ inputs.sbom_format }}
          include_dev: ${{ inputs.sbom_include_dev }}
          output_directory: ${{ runner.temp }}/sbom
          untrusted_checkout: 'false'

      # grype-scan-action's 'dependencies-changed' gate reads this
      # sidecar. A missing parent leaves it unwritten, and the action
      # then gates: an unknown answer must not wave findings through.
      - name: 'Record whether dependencies changed'
        shell: bash
        env:
          SBOM_DIR: ${{ runner.temp }}/sbom
        run: |
          # Record whether dependencies changed
          set -euo pipefail
          if ! git rev-parse --verify --quiet 'HEAD^1' > /dev/null; then
            echo "::notice::No parent commit; dependency change unknown"
            exit 0
          fi
          changed=false
          # NUL-delimited: git quotes a path holding a space, a quote or
          # a non-ASCII byte, which would never match below. No rename
          # detection, so a manifest moved away counts at its old path.
          while IFS= read -r -d '' file; do
            case "$file" in
              Cargo.toml | */Cargo.toml | Cargo.lock | */Cargo.lock \
                | .cargo/config | .cargo/config.toml \
                | */.cargo/config | */.cargo/config.toml)
                changed=true ;;
            esac
          done < <(git diff -z --no-renames --name-only 'HEAD^1' HEAD)
          printf '{"changed": %s}\n' "$changed" \
            > "$SBOM_DIR/dependency-change.json"
          echo "Dependencies changed: $changed"

      - name: 'Upload SBOM artefacts'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-files${{ inputs.artefact_suffix }}
          path: ${{ runner.temp }}/sbom/
          retention-days: 45
          # The Grype job needs this artefact, so a missing SBOM must
          # surface here rather than there.
          if-no-files-found: error

  grype:
    name: 'Grype Audit SBOM'
    needs: sbom
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.sbom.result == 'success' && inputs.grype_enabled }}
