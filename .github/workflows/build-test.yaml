---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Rust build/test pipeline: the verify lane.
#
# Runs on pull requests and Gerrit patch sets. The repository-metadata
# job runs in parallel as an informational step. After the build, the
# jobs in { } run in parallel; none gates another, so a change surfaces
# every failure at once (-> denotes sequence):
#   rust-metadata -> { check-release | build }
#   build -> { tests | audit | sbom -> grype | cbom }
#
# rust-metadata resolves one exact toolchain for the run, the test
# matrix and the runners matrix (docs/BRIEF.md Q3, Q6, D4). build and
# tests run once per runner; tests also once per toolchain leg. audit,
# sbom and grype run once: the lockfile they read is the same on every
# platform. Every job after rust-metadata checks out the commit it
# read, or the immutable Gerrit patch set it read, so a branch 'ref'
# or refspec that moves mid-run can't split the run across two
# revisions. check-release reads any Model B release file
# the change adds under releases/ exactly as the merge lane will once
# it merges, so a file the merge lane would refuse fails review instead.
#
# Call this from a thin caller workflow; see examples/build-test/ for
# a plain GitHub-native caller and a Gerrit-wrapped caller.
name: '[R] Rust Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = event ref)'
        required: false
        type: string
        default: ''

      # --- Project selection ---
      path_prefix:
        description: 'Directory holding the project'
        required: false
        type: string
        default: '.'
      manifest_path:
        description: 'Cargo.toml to act on, relative to path_prefix'
        required: false
        type: string
        default: 'Cargo.toml'
      workspace:
        description: 'Act on every workspace member (--workspace)'
        required: false
        type: boolean
        default: true
      packages:
        description: 'Whitespace-separated packages; replaces workspace'
        required: false
        type: string
        default: ''
      exclude:
        description: 'Members to skip; needs workspace and no packages'
        required: false
        type: string
        default: ''
      features:
        description: 'Features to enable, separated by spaces or commas'
        required: false
        type: string
        default: ''
      all_features:
        description: 'Enable every feature (--all-features)'
        required: false
        type: boolean
        default: false
      no_default_features:
        description: 'Disable default features (--no-default-features)'
        required: false
        type: boolean
        default: false

      # --- Toolchain and environment ---
      toolchain:
        description: >-
          Toolchain for every job. Empty uses the project's toolchain
          file, or stable without one. A moving channel resolves to an
          exact release once per run.
        required: false
        type: string
        default: ''
      lockfile_required:
        description: >-
          Fail when the project commits no Cargo.lock. When false, the
          run resolves one and every job reads that graph.
        required: false
        type: boolean
        default: false
      setup_script:
        description: >-
          Committed script, relative to path_prefix, run with bash
          before cargo in the build and test jobs (native libraries)
        required: false
        type: string
        default: ''
      runners:
        description: >-
          JSON array of {runner, arch} objects; build and tests run once
          per entry. 'arch' names the artefacts.
        required: false
        type: string
        default: '[{"runner": "ubuntu-latest", "arch": "x64"}]'
      cache:
        description: >-
          Restore and save a Cargo cache in the build and test jobs.
          The release and merge lanes never restore one.
        required: false
        type: boolean
        default: false

      # --- Build ---
      target:
        description: 'Target triple to build for; empty builds for the host'
        required: false
        type: string
        default: ''
      profile:
        description: 'Cargo profile: dev, release or a custom profile'
        required: false
        type: string
        default: 'release'
      cargo_args:
        description: "Extra 'cargo build' arguments, split on whitespace"
        required: false
        type: string
        default: ''
      binaries:
        description: 'Collect built binaries, with SHA256SUMS, as an artefact'
        required: false
        type: boolean
        default: false
      auditable:
        description: "Build binaries with 'cargo auditable'; needs binaries"
        required: false
        type: boolean
        default: false
      build_timeout_minutes:
        description: 'Timeout for each build job'
        required: false
        type: number
        default: 20

      # --- Tests ---
      tests_enabled:
        description: 'Run the test jobs (set false to skip)'
        required: false
        type: boolean
        default: true
      test_matrix:
        description: >-
          'project' tests the project toolchain; 'msrv' adds the declared
          rust-version; 'full' adds recent stable minors and stable.
        required: false
        type: string
        default: 'msrv'
      test_runner:
        description: "'cargo' (cargo test) or 'nextest' (cargo nextest run)"
        required: false
        type: string
        default: 'cargo'
      test_args:
        description: 'Extra test runner arguments, split on whitespace'
        required: false
        type: string
        default: ''
      doc_tests:
        description: 'Run doc tests'
        required: false
        type: boolean
        default: true
      coverage:
        description: 'Measure coverage with cargo-llvm-cov (project leg)'
        required: false
        type: boolean
        default: false
      test_permit_fail:
        description: >-
          Permit test failures without failing the job. When false,
          falls back to the NO_BLOCK_AUDIT_FAIL repository variable.
        required: false
        type: boolean
        default: false
      test_timeout_minutes:
        description: 'Timeout for each test job'
        required: false
        type: number
        default: 20

      # --- Audit ---
      audit_enabled:
        description: 'Run the cargo-audit job (set false to skip)'
        required: false
        type: boolean
        default: true
      audit_permit_fail:
        description: >-
          Permit audit failures without failing the job. When false,
          falls back to the NO_BLOCK_AUDIT_FAIL repository variable.
        required: false
        type: boolean
        default: false
      audit_ignore_vulns:
        description: 'RUSTSEC advisory IDs to ignore, whitespace-separated'
        required: false
        type: string
        default: ''
      audit_allow_list_path:
        description: 'File of RUSTSEC IDs to ignore, relative to path_prefix'
        required: false
        type: string
        default: ''
      deny_enabled:
        description: 'Also run cargo-deny in the audit job'
        required: false
        type: boolean
        default: false
      deny_checks:
        description: 'cargo-deny checks: advisories bans licenses sources'
        required: false
        type: string
        default: 'advisories bans licenses sources'
      audit_timeout_minutes:
        description: 'Timeout for the audit, SBOM and Grype jobs'
        required: false
        type: number
        default: 10

      # --- SBOM ---
      sbom_enabled:
        description: >-
          Generate an SBOM (set false to skip). The Grype job scans the
          SBOM, so skipping generation skips the scan too. To keep the
          SBOM but drop the scan, use grype_enabled instead.
        required: false
        type: boolean
        default: true
      sbom_format:
        description: "SBOM output format: 'json', 'xml' or 'both'"
        required: false
        type: string
        default: 'both'
      sbom_include_dev:
        description: >-
          Include Cargo build-dependencies in the SBOM. Dev-dependencies
          never ship with a crate, so the SBOM leaves them out either
          way.
        required: false
        type: boolean
        default: false

      # --- Grype scan ---
      grype_enabled:
        description: >-
          Run the Grype vulnerability scan over the SBOM (set false to
          skip). Disabling the scan keeps the SBOM; disabling the SBOM
          also stops the scan, which has nothing to read.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: >-
          Lowest severity that fails the scan: negligible, low, medium,
          high or critical; 'none' reports without gating
        required: false
        type: string
        default: 'medium'
      grype_dependency_policy:
        description: >-
          Which Grype findings gate: 'all' gates every finding; 'declared'
          gates the crates the project declares and reports inherited
          ones as warnings, subject to grype_transitive_fail_on
        required: false
        type: string
        default: 'all'
      grype_transitive_fail_on:
        description: >-
          Under grype_dependency_policy 'declared', the lowest severity
          at which an inherited crate gates: negligible, low, medium,
          high or critical; 'none' never gates on one
        required: false
        type: string
        default: 'none'
      grype_permit_fail:
        description: >-
          Report Grype findings without failing the job. When false,
          falls back to the NO_BLOCK_AUDIT_FAIL repository variable.
        required: false
        type: boolean
        default: false
      grype_gate_when:
        description: >-
          'always' gates on every scan. 'dependencies-changed' gates
          only when the change touches Cargo.toml, Cargo.lock or Cargo
          configuration, and otherwise reports findings as warnings.
        required: false
        type: string
        default: 'always'
      grype_only_fixed:
        description: 'Report only vulnerabilities that have a fix'
        required: false
        type: boolean
        default: false
      grype_cache_db:
        description: "Grype database cache: 'true', 'false' or 'restore-only'"
        required: false
        type: string
        default: 'true'

      # --- CBOM (advisory) ---
      cbom_enabled:
        description: >-
          Generate a cryptography bill of materials. cbom-action cannot
          analyse Rust yet; it scans any Java, Python or Go sources in
          the project and skips a Rust-only project.
        required: false
        type: boolean
        default: false
      cbom_languages:
        description: "cbom-action languages; empty auto-detects. Never 'rust'"
        required: false
        type: string
        default: ''
      cbom_timeout_minutes:
        description: 'Timeout for the CBOM job'
        required: false
        type: number
        default: 30

      # --- Artefacts ---
      artefact_suffix:
        description: >-
          Suffix for every artefact this run uploads, such as '-core',
          so several calls in one workflow run cannot clash: empty, or
          '-' and up to 64 letters, digits, '.', '_' or '-'
        required: false
        type: string
        default: ''

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

    outputs:
      has_release:
        description: "'true' when the change adds a release file"
        value: ${{ jobs.check-release.outputs.has_release }}
      version:
        description: 'Version the release file names; empty without one'
        value: ${{ jobs.check-release.outputs.version }}
      project:
        description: >-
          Project the release file names; empty for a repository-wide
          file or without one
        value: ${{ jobs.check-release.outputs.project }}
      tag:
        description: 'Tag the release would create; empty without one'
        value: ${{ jobs.check-release.outputs.tag }}

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Inputs'
    # Fails fast with a clear message on inputs the jobs would otherwise
    # reject one by one, in every matrix leg. This job always runs (only
    # its steps are conditional), so gating dependents on it does not
    # trip GitHub's "skipped need skips dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # Require Gerrit project, branch and URL
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

      - name: 'Check the enumerated inputs'
        shell: bash
        env:
          TEST_RUNNER: ${{ inputs.test_runner }}
          ARTEFACT_SUFFIX: ${{ inputs.artefact_suffix }}
          SBOM_FORMAT: ${{ inputs.sbom_format }}
          GRYPE_FAIL_ON: ${{ inputs.grype_fail_on }}
          GRYPE_DEPENDENCY_POLICY: ${{ inputs.grype_dependency_policy }}
          GRYPE_TRANSITIVE_FAIL_ON: ${{ inputs.grype_transitive_fail_on }}
          GRYPE_GATE_WHEN: ${{ inputs.grype_gate_when }}
          GRYPE_CACHE_DB: ${{ inputs.grype_cache_db }}
          CBOM_LANGUAGES: ${{ inputs.cbom_languages }}
        run: |
          # Check the enumerated inputs
          failed=0
          check() {
            local name="$1" value="$2" allowed=" $3 "
            case "$allowed" in
              *" $value "*) ;;
              *)
                echo "::error::$name: expected one of:$allowed"
                failed=1 ;;
            esac
          }
          check test_runner "$TEST_RUNNER" 'cargo nextest'
          check sbom_format "$SBOM_FORMAT" 'json xml both'
          check grype_fail_on "$GRYPE_FAIL_ON" \
            'negligible low medium high critical none'
          check grype_dependency_policy "$GRYPE_DEPENDENCY_POLICY" \
            'all declared'
          check grype_transitive_fail_on "$GRYPE_TRANSITIVE_FAIL_ON" \
            'negligible low medium high critical none'
          check grype_gate_when "$GRYPE_GATE_WHEN" \
            'always dependencies-changed'
          check grype_cache_db "$GRYPE_CACHE_DB" 'true false restore-only'
          case ",${CBOM_LANGUAGES// /}," in
            *,rust,*)
              echo "::error::cbom_languages: cbom-action cannot" \
                "analyse Rust; leave it out"
              failed=1 ;;
          esac
          if ! [[ "$ARTEFACT_SUFFIX" =~ ^(-[A-Za-z0-9._-]{1,64})?$ ]]; then
            echo "::error::artefact_suffix: expected '' or '-' and up to" \
              "64 of A-Z a-z 0-9 . _ -"
            failed=1
          fi
          exit "$failed"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@2206d754f65f1a90f57b49be546712c5f594def2  # v0.3.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  rust-metadata:
    name: 'Rust Metadata'
    needs: gerrit-validate
    permissions:
      contents: read
    uses: $/.github/workflows/rust-metadata.yaml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      path_prefix: ${{ inputs.path_prefix }}
      manifest_path: ${{ inputs.manifest_path }}
      workspace: ${{ inputs.workspace }}
      packages: ${{ inputs.packages }}
      exclude: ${{ inputs.exclude }}
      toolchain: ${{ inputs.toolchain }}
      test_matrix: ${{ inputs.test_matrix }}
      runners: ${{ inputs.runners }}
      lockfile_required: ${{ inputs.lockfile_required }}
      harden_runner_egress: ${{ inputs.harden_runner_egress }}
      harden_runner_allowlist: ${{ inputs.harden_runner_allowlist }}
      gerrit_refspec: ${{ inputs.gerrit_refspec }}
      gerrit_project: ${{ inputs.gerrit_project }}
      gerrit_branch: ${{ inputs.gerrit_branch }}
      gerrit_url: ${{ inputs.gerrit_url }}
      artefact_suffix: ${{ inputs.artefact_suffix }}

  # A Model B release file the change adds under releases/, checked as
  # the merge lane's check-release job will read it once the change
  # merges: one regular YAML file, a final 'version: X.Y.Z', and every
  # publishable crate rust-metadata lists carrying that version. Only
  # files naming no project, or this call's path_prefix, apply. The
  # check reads the commit rust-metadata read, so the file and the
  # crate versions come from one revision when 'ref' names a branch
  # that moves. An existing release tag is a warning here, whichever
  # commit it names: the merged commit does not exist yet, so the tag
  # names something else, and the merge lane refuses the release. A
  # change without a release file passes with a note.
  check-release:
    name: 'Check for Release File'
    needs: rust-metadata
    permissions:
      contents: read
    uses: $/.github/workflows/release-check.yaml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ needs.rust-metadata.outputs.sha }}
      # Every commit the change adds, relative to the branch it targets:
      # a pull request's base, or the commit a push replaced. Gerrit
      # patch sets and explicit refs compare the checked-out commit
      # with its first parent instead.
      # yamllint disable rule:line-length
      base: >-
        ${{ (inputs.gerrit_refspec == '' && inputs.ref == ''
          && (inputs.repository == '' || inputs.repository == github.repository))
        && ((github.event_name == 'pull_request' && github.event.pull_request.base.sha)
          || (github.event_name == 'push' && github.event.before))
        || '' }}
      # yamllint enable rule:line-length
      # A release file naming another project is not this call's.
      path_prefix: ${{ inputs.path_prefix }}
      # yamllint disable-line rule:line-length
      publishable_packages: ${{ needs.rust-metadata.outputs.publishable_packages }}
      tag_conflict: 'review'
      harden_runner_egress: ${{ inputs.harden_runner_egress }}
      harden_runner_allowlist: ${{ inputs.harden_runner_allowlist }}
      # A change refspec is the patch set under test, as rust-metadata
      # read it: a patch set is immutable, and Gerrit is not asked for
      # an unmerged commit by SHA, which the checkout action's
      # mirror-less path does not support and the servers are not
      # known to serve. Any other refspec names a merged commit that
      # can move, so the check fetches rust-metadata's commit by SHA,
      # as the later jobs and the merge lane do.
      gerrit_refspec: >-
        ${{ inputs.gerrit_refspec != ''
          && !startsWith(inputs.gerrit_refspec, 'refs/changes/')
          && needs.rust-metadata.outputs.sha
          || inputs.gerrit_refspec }}
      gerrit_project: ${{ inputs.gerrit_project }}
      gerrit_branch: ${{ inputs.gerrit_branch }}
      gerrit_url: ${{ inputs.gerrit_url }}

  build:
    name: 'Build (${{ matrix.platform.arch }})'
    needs: rust-metadata
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.rust-metadata.outputs.runners) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Every job after rust-metadata checks out the commit it read
      # (docs/BRIEF.md Q6), so a branch 'ref' that moves mid-run can't
      # give two jobs different source. A Gerrit change refspec names
      # an immutable patch set and is fetched as given, as check-release
      # does; any other Gerrit refspec names a merged commit, which the
      # checkout action fetches by SHA, as in the merge lane. On the
      # GitHub path a tag is checked out by name, so the tag exists in
      # the checkout, and the pin step fails the job if it has moved;
      # a branch is restored as a local branch at the commit, so a
      # build script still finds one.
      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          # yamllint disable-line rule:line-length
          gerrit-refspec: ${{ startsWith(inputs.gerrit_refspec, 'refs/changes/') && inputs.gerrit_refspec || needs.rust-metadata.outputs.sha }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # yamllint disable-line rule:line-length
          ref: ${{ startsWith(needs.rust-metadata.outputs.ref, 'refs/tags/') && needs.rust-metadata.outputs.ref || needs.rust-metadata.outputs.sha }}
          persist-credentials: false

      - name: 'Pin the commit rust-metadata read'
        if: inputs.gerrit_refspec == ''
        shell: bash
        env:
          SHA: ${{ needs.rust-metadata.outputs.sha }}
          REF: ${{ needs.rust-metadata.outputs.ref }}
        run: |
          # Pin the commit rust-metadata read
          set -euo pipefail
          head="$(git rev-parse HEAD)"
