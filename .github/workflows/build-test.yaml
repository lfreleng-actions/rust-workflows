        if: inputs.gerrit_refspec == ''
        shell: bash
        env:
          SHA: ${{ needs.rust-metadata.outputs.sha }}
          REF: ${{ needs.rust-metadata.outputs.ref }}
        run: |
          # Pin the commit rust-metadata read
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ -z "$SHA" ] || [ "$head" != "$SHA" ]; then
            echo "::error::Checked out $head, but rust-metadata read" \
              "'$SHA'; ${REF:-the ref} moved during the run"
            exit 1
          fi
          case "$REF" in
            refs/heads/*)
              git checkout --quiet -B "${REF#refs/heads/}"
              echo "On branch ${REF#refs/heads/} at $SHA" ;;
            refs/tags/*)
              echo "At tag ${REF#refs/tags/}, commit $SHA" ;;
            *)
              echo "At commit $SHA" ;;
          esac

      - name: 'Restore the resolved lockfile'
        if: needs.rust-metadata.outputs.lockfile_generated == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.rust-metadata.outputs.lockfile_artefact }}
          path: ${{ needs.rust-metadata.outputs.lockfile_dir }}

      # sbom-action pins no toolchain: it runs cargo in the project,
      # where a toolchain file would choose one. Install the run's
      # resolved toolchain from outside the checkout, with the scrub
      # the other jobs apply (docs/BRIEF.md Q4), and name it to the
      # SBOM step alone through RUSTUP_TOOLCHAIN.
      - name: 'Install the toolchain'
