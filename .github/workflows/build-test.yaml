      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-files${{ inputs.artefact_suffix }}

      # grype_permit_fail, or the NO_BLOCK_AUDIT_FAIL repository
      # variable, keeps findings from failing the job, so a pull request
      # can proceed while a newly published CVE in an untouched
      # transitive dependency awaits a fix. grype_gate_when narrows the
      # gate to changes that touch dependencies.
      - name: 'Grype audit SBOM'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@7b6b12b60de8ff051f2f8021439c1ef0b82b98c1  # v0.4.0
        with:
          # The JSON document, or the XML one when that is all there is.
          # yamllint disable-line rule:line-length
          sbom: ${{ inputs.sbom_format == 'xml' && 'sbom-cyclonedx.xml' || 'sbom-cyclonedx.json' }}
          fail-on: ${{ inputs.grype_fail_on }}
          dependency-policy: ${{ inputs.grype_dependency_policy }}
          transitive-fail-on: ${{ inputs.grype_transitive_fail_on }}
          only-fixed: ${{ inputs.grype_only_fixed }}
          gate-when: ${{ inputs.grype_gate_when }}
          dependency-change-manifest: 'dependency-change.json'
          cache-db: ${{ inputs.grype_cache_db }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: grype-scan-results${{ inputs.artefact_suffix }}

  cbom:
    name: 'Generate CBOM'
    needs:
      - rust-metadata
      - build
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.cbom_enabled }}
    # Advisory: findings, a scanner error or a timeout never fail the
    # run, and no other job waits for this one.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.cbom_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          # yamllint disable-line rule:line-length
          gerrit-refspec: ${{ startsWith(inputs.gerrit_refspec, 'refs/changes/') && inputs.gerrit_refspec || needs.rust-metadata.outputs.sha }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # yamllint disable-line rule:line-length
          ref: ${{ startsWith(needs.rust-metadata.outputs.ref, 'refs/tags/') && needs.rust-metadata.outputs.ref || needs.rust-metadata.outputs.sha }}
          persist-credentials: false

      - name: 'Pin the commit rust-metadata read'
        if: inputs.gerrit_refspec == ''
        shell: bash
        env:
          SHA: ${{ needs.rust-metadata.outputs.sha }}
          REF: ${{ needs.rust-metadata.outputs.ref }}
        run: |
          # Pin the commit rust-metadata read
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ -z "$SHA" ] || [ "$head" != "$SHA" ]; then
            echo "::error::Checked out $head, but rust-metadata read" \
              "'$SHA'; ${REF:-the ref} moved during the run"
            exit 1
          fi
          case "$REF" in
            refs/heads/*)
              git checkout --quiet -B "${REF#refs/heads/}"
              echo "On branch ${REF#refs/heads/} at $SHA" ;;
            refs/tags/*)
              echo "At tag ${REF#refs/tags/}, commit $SHA" ;;
            *)
              echo "At commit $SHA" ;;
          esac

      - name: 'Generate CBOM'
        id: cbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/cbom-action@ec9253d00fccbe103002ada6067224ec767a7b1c  # v0.0.2
        with:
          path_prefix: ${{ inputs.path_prefix }}
          output_directory: ${{ runner.temp }}/cbom
          languages: ${{ inputs.cbom_languages }}
          fail_on_error: 'false'

      - name: 'Upload CBOM artefacts'
        # yamllint disable-line rule:line-length
        if: ${{ !cancelled() && steps.cbom.outcome == 'success' && steps.cbom.outputs.file_count != '0' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cbom-files${{ inputs.artefact_suffix }}
          path: ${{ steps.cbom.outputs.cbom_pattern }}
          retention-days: 45
          if-no-files-found: warn
