---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Exercises the reusable Rust lanes in this repository against the
# lfreleng-actions/test-rust-project fixture: its root crate and each
# variant under variants/ (docs/BRIEF.md Q14), in parallel.
#
# The reusable workflows are referenced with the self-repository
# form ('$/'), which resolves this repository at the commit already
# running. The workflows under test are therefore always the ones
# this branch defines, independently of what any checkout puts in
# the workspace.
#
# The release and merge lanes run as dry runs: they validate, build,
# test, audit, scan and verify the crates, but draft, sign, publish and
# tag nothing. Nobody can take a crates.io version back, so the real
# publish path is exercised by test-rust-project's own tag releases.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - master

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

# Every call below checks out test-rust-project at main after #11 and
# #12 (df3d10b): crate 0.1.1, published by the signed tag v0.1.1 on that
# commit, with the fixture variants. The env context is unavailable in
# a reusable workflow call's 'with', so each call repeats the SHA.

jobs:
  # Every checkout in a reusable workflow must name the repository it
  # targets. The Gerrit checkout action defaults 'repository' to
  # github.repository, which inside a reusable workflow names the
  # CALLER, not the project under review. A central .github repository
  # acting for another project then seeds the tree from itself. That
  # broke every ONAP documentation check after the docs-workflows
  # migration landed, so guard the shape here rather than trusting
  # review to spot a missing line in a 900-line workflow.
  checkout-targets:
    name: 'Checkout Targets'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Every checkout names a repository'
        shell: bash
        run: |
          # Every checkout in a reusable workflow names a repository
          python3 -I - <<'GUARD'
          import pathlib, re, sys

          CHECKOUT = re.compile(
              r"uses:\s*(?:actions/checkout"
              r"|[\w-]+/checkout-gerrit-change-action)@")
          GERRIT = re.compile(r"uses:\s*[\w-]+/checkout-gerrit-change-action@")
          REUSABLE = re.compile(r"^\s{2}workflow_call:", re.M)
          DECLARES = re.compile(r"^\s{6}repository:", re.M)
          NAMES = re.compile(r"^\s+repository:", re.M)
          REF = re.compile(r"^\s+ref:", re.M)

          def nested(text, key):
              # Return the mapping nested under 'key', so a match cannot
              # come from a sibling such as 'env'. A checkout that sets
              # env.repository would otherwise satisfy the guard while
              # with.repository stayed absent.
              lines = text.splitlines()
              for index, line in enumerate(lines):
                  if not re.match(r"^\s+%s:\s*$" % key, line):
                      continue
                  width = len(line) - len(line.lstrip())
                  body = []
                  for entry in lines[index + 1:]:
                      stripped = entry.strip()
                      if stripped and not stripped.startswith("#"):
                          if len(entry) - len(entry.lstrip()) <= width:
                              break
                      body.append(entry)
                  return "\n".join(body)
              return ""

          def block(lines, index):
              start = index
              while start and not lines[start].lstrip().startswith("- "):
                  start -= 1
              width = len(lines[start]) - len(lines[start].lstrip())
              end = start + 1
              while end < len(lines):
                  body = lines[end].strip()
                  if body and not body.startswith("#"):
                      if len(lines[end]) - len(lines[end].lstrip()) <= width:
                          break
                  end += 1
              return "\n".join(lines[start:end])

          hint = "$" + "{{ inputs.repository || github.repository }}"
          fix = "repository: " + hint
          failures = checked = 0

          for wf in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              text = wf.read_text(encoding="utf-8")
              if not REUSABLE.search(text):
                  continue
              declares = DECLARES.search(text) is not None
              lines = text.splitlines()
              checked += 1
              for number, line in enumerate(lines):
                  if not CHECKOUT.search(line):
                      continue
                  supplied = nested(block(lines, number), "with")
                  if NAMES.search(supplied):
                      continue
                  if declares:
                      why = "the workflow declares a 'repository' input"
                  elif GERRIT.search(line) and REF.search(supplied):
                      why = "this Gerrit checkout pins 'ref'"
                  else:
                      continue
                  print(f"::error file={wf},line={number + 1}::Checkout does "
                        f"not name a repository, but {why}. Add: {fix}")
                  failures += 1

          print(f"Checked {checked} reusable workflow(s); "
                f"{failures} problem(s).")
          sys.exit(1 if failures else 0)
          GUARD

  # The verify lane against the root crate and every fixture variant.
  # Each entry sets every key it uses, so a missing key can never reach
  # a boolean input as an empty string.
  verify:
    name: 'Verify (${{ matrix.name }})'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two platforms, nextest, coverage, binaries and
          # dependency-scoped Grype gating. The fixture is pure Rust, so
          # the CBOM job proves its wiring and its clean skip, not a
          # scan: cbom-action has no Rust support, and its own tests
          # cover scanning.
          - name: 'root'
            path_prefix: '.'
            workspace: false
            # yamllint disable-line rule:line-length
            runners: '[{"runner": "ubuntu-latest", "arch": "x64"}, {"runner": "ubuntu-24.04-arm", "arch": "arm64"}]'
            test_matrix: 'msrv'
            test_runner: 'nextest'
            coverage: true
            binaries: true
            features: ''
            setup_script: ''
            lockfile_required: true
            cbom_enabled: true
            grype_gate_when: 'dependencies-changed'
          # A virtual workspace with a publish = false member.
          - name: 'workspace'
            path_prefix: 'variants/workspace'
            workspace: false
            runners: '[{"runner": "ubuntu-latest", "arch": "x64"}]'
            test_matrix: 'msrv'
            test_runner: 'cargo'
            coverage: false
            binaries: true
            features: ''
            setup_script: ''
            lockfile_required: true
            cbom_enabled: false
            grype_gate_when: 'always'
          # A member as path_prefix, acting on the whole workspace: the
          # SBOM describes the workspace root while its Cargo runs in
          # the member, where the build runs it.
          - name: 'workspace-member'
            path_prefix: 'variants/workspace/cli'
            workspace: true
            runners: '[{"runner": "ubuntu-latest", "arch": "x64"}]'
            test_matrix: 'project'
            test_runner: 'cargo'
            coverage: false
            binaries: false
            features: ''
            setup_script: ''
            lockfile_required: true
            cbom_enabled: false
            grype_gate_when: 'always'
          # No committed Cargo.lock: rust-metadata resolves one and
          # every job restores it.
          - name: 'no-lockfile'
            path_prefix: 'variants/no-lockfile'
            workspace: false
            runners: '[{"runner": "ubuntu-latest", "arch": "x64"}]'
            test_matrix: 'project'
            test_runner: 'cargo'
            coverage: false
            binaries: false
            features: ''
            setup_script: ''
            lockfile_required: false
            cbom_enabled: false
            grype_gate_when: 'always'
          # A pinned toolchain above the declared MSRV: the full matrix,
          # under nextest so every leg leaves a JUnit report to check.
          - name: 'msrv'
            path_prefix: 'variants/msrv'
            workspace: false
            runners: '[{"runner": "ubuntu-latest", "arch": "x64"}]'
            test_matrix: 'full'
            test_runner: 'nextest'
            coverage: false
            binaries: false
            features: ''
            setup_script: ''
            lockfile_required: true
            cbom_enabled: false
            grype_gate_when: 'always'
          # A real crates.io dependency for the audit, SBOM and Grype.
          - name: 'dependencies'
            path_prefix: 'variants/dependencies'
            workspace: false
            runners: '[{"runner": "ubuntu-latest", "arch": "x64"}]'
            test_matrix: 'project'
            test_runner: 'cargo'
            coverage: false
            binaries: false
            features: ''
            setup_script: ''
            lockfile_required: true
            cbom_enabled: false
            grype_gate_when: 'always'
          # A native library installed by setup_script.
          - name: 'native'
            path_prefix: 'variants/native'
            workspace: false
            runners: '[{"runner": "ubuntu-latest", "arch": "x64"}]'
            test_matrix: 'project'
            test_runner: 'cargo'
            coverage: false
            binaries: false
            features: ''
            setup_script: 'setup.sh'
            lockfile_required: true
            cbom_enabled: false
            grype_gate_when: 'always'
          # A non-default feature selection.
          - name: 'features'
            path_prefix: 'variants/features'
            workspace: false
            runners: '[{"runner": "ubuntu-latest", "arch": "x64"}]'
            test_matrix: 'project'
            test_runner: 'cargo'
            coverage: false
            binaries: false
            features: 'french'
            setup_script: ''
            lockfile_required: true
            cbom_enabled: false
            grype_gate_when: 'always'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
      issues: read  # grype-scan-action reads cve-bypass issues
    uses: $/.github/workflows/build-test.yaml
    with:
      repository: 'lfreleng-actions/test-rust-project'
      ref: 'df3d10b10c86d57e323f1042e246417baf684e7f'
      path_prefix: ${{ matrix.path_prefix }}
      workspace: ${{ matrix.workspace }}
      runners: ${{ matrix.runners }}
      test_matrix: ${{ matrix.test_matrix }}
      test_runner: ${{ matrix.test_runner }}
      coverage: ${{ matrix.coverage }}
      binaries: ${{ matrix.binaries }}
      features: ${{ matrix.features }}
      setup_script: ${{ matrix.setup_script }}
      lockfile_required: ${{ matrix.lockfile_required }}
      cbom_enabled: ${{ matrix.cbom_enabled }}
      grype_gate_when: ${{ matrix.grype_gate_when }}
      artefact_suffix: -${{ matrix.name }}

  # The verify lane's release-file check, on the fixture's merge commit
  # that adds releases/workspace-0.1.0.yaml for the workspace variant:
  # the version every publishable member carries. The other stages are
  # off, so the run proves the check and little else. v0.1.0 already
  # names the root crate's release on another commit, so this also
  # exercises the advisory tag warning the verify lane gives.
  verify-release-file:
    name: 'Verify (release file)'
    # A reusable workflow may not request permissions its caller lacks,
    # and GitHub checks every nested job when the run starts, the
    # skipped ones included, so this grants what the Grype job declares.
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
      issues: read  # grype-scan-action reads cve-bypass issues
    uses: $/.github/workflows/build-test.yaml
    with:
      repository: 'lfreleng-actions/test-rust-project'
      ref: 'bce2cc4d755482611d38a2f8f90661a89efcf4f6'
      path_prefix: 'variants/workspace'
      tests_enabled: false
      audit_enabled: false
      sbom_enabled: false
      artefact_suffix: '-release-file'

  # The release-file check's own script, run outside a lane against
  # scratch repositories and the fixture, so every refusal the lanes
  # make is exercised without a red lane run: a malformed file, a file
  # YAML can't parse, a duplicate or missing version key, two YAML
  # documents, a value with a trailing newline, two files in one
  # change, a pre-release version, a release file renamed from the
  # last one, a name
  # outside the plain set, a version the crates don't carry (the
  # fixture's merge commit read with the root crate selected), and a
  # release file in an earlier commit of a batched change, which the
  # base comparison finds and a tip-only one misses. The tag check runs
  # the same way against a stub gh, across its three policies.
  release-check-cases:
    name: 'Release File Checks'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The step reads its environment alone, so the script it runs is
      # the one the lanes run, not a copy that could drift. yq ships on
      # the runner image.
      - name: 'Extract the detection script'
        shell: bash
        env:
          SCRIPT: ${{ runner.temp }}/detect.sh
        run: |
          # Extract the detection script
          yq '.jobs.check-release.steps[] | select(.id == "detect") | .run' \
            .github/workflows/release-check.yaml > "$SCRIPT"
          grep -q '^set -euo pipefail$' "$SCRIPT"
          bash -n "$SCRIPT"
          wc -l "$SCRIPT"

      - name: 'Run the cases'
        shell: bash
        env:
          SCRIPT: ${{ runner.temp }}/detect.sh
          CASES: ${{ runner.temp }}/cases
          FIXTURE: 'https://github.com/lfreleng-actions/test-rust-project'
          FIXTURE_SHA: 'bce2cc4d755482611d38a2f8f90661a89efcf4f6'
          GIT_AUTHOR_NAME: 'Release Check'
          GIT_AUTHOR_EMAIL: 'release-check@example.invalid'
          GIT_COMMITTER_NAME: 'Release Check'
          GIT_COMMITTER_EMAIL: 'release-check@example.invalid'
        run: |
          # Run the cases
          set -euo pipefail
          failed=0
          pass() { echo "✅ $1"; }
          miss() { echo "::error::$1"; failed=1; }

          # run <dir> <base> <publishable>: the script's exit code lands
          # in rc, its output in log, and GITHUB_OUTPUT in a scratch file.
          export GITHUB_OUTPUT="$CASES/output"
          export GITHUB_STEP_SUMMARY="$CASES/summary"
          run() {
            export BASE="$2" PUBLISHABLE="$3"
            : > "$GITHUB_OUTPUT"
            : > "$GITHUB_STEP_SUMMARY"
            rc=0
            log="$(cd "$1" && bash "$SCRIPT" 2>&1)" || rc=$?
          }
          expect_fail() {
            if [ "$rc" -ne 0 ] && grep -qF -- "$2" <<< "$log"; then
              pass "$1"
            else
              miss "$1: exit $rc, output: $log"
            fi
          }
          outputs() { tr '\n' ' ' < "$GITHUB_OUTPUT"; }
          expect_release() {
            if [ "$rc" -eq 0 ] \
              && grep -qx 'has_release=true' "$GITHUB_OUTPUT" \
              && grep -qx "version=$2" "$GITHUB_OUTPUT" \
              && grep -qx "file=$3" "$GITHUB_OUTPUT"; then
              pass "$1"
            else
              miss "$1: exit $rc, output: $log; $(outputs)"
            fi
          }
          expect_none() {
            if [ "$rc" -eq 0 ] \
              && grep -qx 'has_release=false' "$GITHUB_OUTPUT"; then
              pass "$1"
            else
              miss "$1: exit $rc, output: $log; $(outputs)"
            fi
          }
          # scratch <name>: a repository with releases/README.md committed
          scratch() {
            local dir="$CASES/$1"
            rm -rf "$dir"
            git init -q -b main "$dir"
            mkdir "$dir/releases"
            echo 'Release files live here' > "$dir/releases/README.md"
            git -C "$dir" add -A
            git -C "$dir" commit -q -m 'Base'
            echo "$dir"
          }
          # commit <dir> <path> <content>: one commit adding one file
          commit() {
            printf '%s\n' "$3" > "$1/$2"
            git -C "$1" add -A
            git -C "$1" commit -q -m "Add $2"
          }
          mkdir -p "$CASES"
          both='[{"name": "alpha", "version": "1.2.0"},
            {"name": "beta", "version": "1.2.0"}]'
          mixed='[{"name": "alpha", "version": "1.2.0"},
            {"name": "beta", "version": "1.1.0"}]'
          final="needs 'version: X.Y.Z', a final release"

          dir="$(scratch none)"
          commit "$dir" src.txt 'not a release'
          run "$dir" '' "$both"
          expect_none 'A change without a release file reports none'

          dir="$(scratch valid)"
          commit "$dir" releases/1.2.0.yaml 'version: 1.2.0'
          run "$dir" '' "$both"
          expect_release 'A valid release file passes' 1.2.0 releases/1.2.0.yaml
          run "$dir" '' ''
          expect_release 'Without crates the version check is skipped' \
            1.2.0 releases/1.2.0.yaml

          dir="$(scratch quoted)"
          commit "$dir" releases/1.2.0.yaml \
            $'# The release\nversion: "1.2.0"  # final\nnotes: none'
          run "$dir" '' "$both"
          expect_release 'A quoted version with a comment passes' \
            1.2.0 releases/1.2.0.yaml

          dir="$(scratch malformed)"
          commit "$dir" releases/1.2.yaml 'version: 1.2'
          run "$dir" '' "$both"
          expect_fail 'A two-part version is refused' "$final"

          dir="$(scratch prerelease)"
          commit "$dir" releases/rc.yaml 'version: 1.2.0-rc.1'
          run "$dir" '' "$both"
          expect_fail 'A pre-release version is refused' "$final"

          # '#' opens a comment only after a space, so YAML reads this
          # value as the one scalar '1.2.0#rc'.
          dir="$(scratch hash)"
          commit "$dir" releases/1.2.0.yaml 'version: 1.2.0#rc'
          run "$dir" '' "$both"
          expect_fail 'A value with a trailing #rc is refused' "$final"

          # The scalar holds a newline a shell substitution would strip.
          dir="$(scratch newline)"
          commit "$dir" releases/1.2.0.yaml 'version: "1.2.0\n"'
          run "$dir" '' "$both"
          expect_fail 'A version with a trailing newline is refused' "$final"

          dir="$(scratch keyless)"
          commit "$dir" releases/next.yaml 'name: next'
          run "$dir" '' "$both"
          expect_fail 'A file without a version key is refused' \
            "exactly one top-level 'version' key"

          dir="$(scratch duplicate)"
          commit "$dir" releases/1.2.0.yaml \
            $'version: 1.2.0\n"version": 1.3.0'
          run "$dir" '' "$both"
          expect_fail 'A duplicate version key is refused' \
            "exactly one top-level 'version' key"

          dir="$(scratch documents)"
          commit "$dir" releases/1.2.0.yaml \
            $'version: 1.2.0\n---\nversion: 1.3.0'
          run "$dir" '' "$both"
          expect_fail 'Two YAML documents are refused' 'holds 2 YAML documents'

          dir="$(scratch sequence)"
          commit "$dir" releases/1.2.0.yaml '- version: 1.2.0'
          run "$dir" '' "$both"
          expect_fail 'A file that is not a mapping is refused' \
            'must be a YAML mapping'

          dir="$(scratch invalid)"
          commit "$dir" releases/1.2.0.yaml 'version: [1.2.0'
          run "$dir" '' "$both"
          expect_fail 'A file YAML cannot parse is refused' 'is not valid YAML'

          dir="$(scratch two)"
          printf 'version: 1.2.0\n' > "$dir/releases/1.2.0.yaml"
          printf 'version: 1.3.0\n' > "$dir/releases/1.3.0.yml"
          git -C "$dir" add -A
          git -C "$dir" commit -q -m 'Add two release files'
          run "$dir" '' "$both"
          expect_fail 'Two release files in one change are refused' \
            'adds 2 release files'

          dir="$(scratch named)"
          commit "$dir" 'releases/odd name.yaml' 'version: 1.2.0'
          run "$dir" '' "$both"
          expect_fail 'A name outside the plain set is refused' \
            'Release file names use'

          dir="$(scratch mismatch)"
          commit "$dir" releases/1.2.0.yaml 'version: 1.2.0'
          run "$dir" '' "$mixed"
          expect_fail 'A version the crates do not carry names them' \
            'another version: beta 1.1.0'

          # A release file renamed from the previous one, with the new
          # version: git calls that a rename, which an added-files diff
          # would miss unless rename detection is off.
          dir="$(scratch renamed)"
          commit "$dir" releases/1.2.0.yaml \
            $'# Release request\n# The version the crates carry\nversion: 1.2.0'
          base="$(git -C "$dir" rev-parse HEAD)"
          git -C "$dir" mv releases/1.2.0.yaml releases/1.3.0.yaml
          sed -i 's/1\.2\.0/1.3.0/' "$dir/releases/1.3.0.yaml"
          git -C "$dir" add -A
          git -C "$dir" commit -q -m 'Release 1.3.0'
          git -C "$dir" diff --name-status "$base" HEAD -- releases \
            | grep -q '^R' || miss 'The renamed fixture is not a rename to git'
          run "$dir" "$base" '[{"name": "alpha", "version": "1.3.0"}]'
          expect_release 'A release file renamed from the last one counts' \
            1.3.0 releases/1.3.0.yaml
          run "$dir" '' '[{"name": "alpha", "version": "1.3.0"}]'
          expect_release 'The tip comparison sees the renamed file too' \
            1.3.0 releases/1.3.0.yaml

          dir="$(scratch batched)"
          base="$(git -C "$dir" rev-parse HEAD)"
          commit "$dir" releases/1.2.0.yaml 'version: 1.2.0'
          commit "$dir" src.txt 'a later commit'
          run "$dir" "$base" "$both"
          expect_release 'A release file in an earlier commit counts' \
            1.2.0 releases/1.2.0.yaml
          run "$dir" '' "$both"
          expect_none 'The tip alone misses it, so the base matters'

          # The fixture's merge commit, which adds the workspace
          # variant's release file, read twice: as the verify lane does
          # with that variant selected, and with the root crate, whose
          # version differs.
          dir="$CASES/fixture"
          rm -rf "$dir"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 2 "$FIXTURE" "$FIXTURE_SHA"
          git -C "$dir" checkout -q FETCH_HEAD
          long='name-too-long-for-crates-io-by-design'
          members="[{\"name\": \"lfreleng-fixture-workspace-cli-$long\",
            \"version\": \"0.1.0\"},
            {\"name\": \"lfreleng-fixture-workspace-core-$long\",
            \"version\": \"0.1.0\"}]"
          run "$dir" '' "$members"
          expect_release 'The fixture release passes with the workspace' \
            0.1.0 releases/workspace-0.1.0.yaml
          run "$dir" '' \
            '[{"name": "lfreleng-test-rust-project", "version": "0.1.1"}]'
          expect_fail 'The fixture release fails with the root crate' \
            'another version: lfreleng-test-rust-project 0.1.1'
          exit "$failed"

      # The tag check's own script, with a stub in place of gh: the
      # three policies against a free tag, a tag on the checked-out
      # commit, one on another commit, an annotated tag naming the
      # commit, a tag object that can't be read and a lookup that
      # fails, so a policy that stops failing, or stops warning, fails
      # here.
      - name: 'Extract the tag check'
        shell: bash
        env:
          SCRIPT: ${{ runner.temp }}/tag-check.sh
        run: |
          # Extract the tag check
          yq '.jobs.check-release.steps[]
            | select(.name == "Check the release tag") | .run' \
            .github/workflows/release-check.yaml > "$SCRIPT"
          grep -q '^set -euo pipefail$' "$SCRIPT"
          bash -n "$SCRIPT"

      - name: 'Run the tag cases'
        shell: bash
        env:
          SCRIPT: ${{ runner.temp }}/tag-check.sh
          STUB: ${{ runner.temp }}/stub
          SHA: '1111111111111111111111111111111111111111'
          OTHER: '2222222222222222222222222222222222222222'
          OBJECT: '3333333333333333333333333333333333333333'
          TAG: 'v1.2.0'
          REPOSITORY: 'example/fixture'
        run: |
          # Run the tag cases
          set -euo pipefail
          failed=0
          pass() { echo "✅ $1"; }
          miss() { echo "::error::$1"; failed=1; }
          # A gh that answers the script's two lookups as CASE says:
          # the tag's ref, then the object an annotated tag names.
          mkdir -p "$STUB"
          cat > "$STUB/gh" <<'EOF'
          #!/usr/bin/env bash
          case "$CASE:$2" in
            free:*/ref/tags/*) echo 'gh: Not Found (HTTP 404)' >&2; exit 1 ;;
            same:*/ref/tags/*) echo "commit $SHA" ;;
            other:*/ref/tags/*) echo "commit $OTHER" ;;
            annotated:*/ref/tags/* | unreadable:*/ref/tags/*)
              echo "tag $OBJECT" ;;
            annotated:*/git/tags/*) echo "$SHA" ;;
            unreadable:*/git/tags/*) echo 'gh: HTTP 502' >&2; exit 1 ;;
            unknown:*/ref/tags/*) echo 'gh: HTTP 503' >&2; exit 1 ;;
            *) echo "unexpected call: $*" >&2; exit 99 ;;
          esac
          EOF
          chmod +x "$STUB/gh"
          export RUNNER_TEMP="$STUB" GH_TOKEN=stub
          # expect <policy> <case> <exit> <text>: the script's exit code
          # and a line its output must carry.
          expect() {
            local rc=0 log
            log="$(CASE="$2" TAG_CONFLICT="$1" PATH="$STUB:$PATH" \
              bash "$SCRIPT" 2>&1)" || rc=$?
            if [ "$rc" -eq "$3" ] && grep -qF -- "$4" <<< "$log"; then
              pass "$1: $2"
            else
              miss "$1: $2: exit $rc, output: $log"
            fi
          }
          for policy in fail warn review; do
            code=0
            mark='::warning::'
            if [ "$policy" = fail ]; then
              code=1
              mark='::error::'
            fi
            expect "$policy" free 0 "$TAG is free"
            expect "$policy" other "$code" \
              "$mark$TAG already exists on $OTHER, not $SHA"
            expect "$policy" unreadable "$code" \
              "${mark}Could not read the tag object $TAG names"
            expect "$policy" unknown "$code" "${mark}Could not look up $TAG"
          done
          # A tag on the commit itself: fine for a merge and its dry run,
          # a warning for a review, whose commit never merges as itself.
          for policy in fail warn; do
            expect "$policy" same 0 "$TAG already names $SHA"
            expect "$policy" annotated 0 "$TAG already names $SHA"
          done
          expect review same 0 \
            "::warning::$TAG already exists, on the commit under review"
          expect review annotated 0 \
            "::warning::$TAG already exists, on the commit under review"
          exit "$failed"

  # The release lane, rehearsed on the signed tag that published crate
  # 0.1.1. A reusable workflow may not request permissions its caller
  # lacks, and GitHub checks every job when the run starts, so this
  # grants what the attach and publish jobs declare; dry_run skips them.
  # Code on a branch of this repository could change the workflows it
  # runs, and GitHub would honour these grants for it, so the dry runs
  # run on fork pull requests, which GitHub limits to read-only
  # tokens, and on manual runs of the default branch, and nowhere else.
  release-dry-run:
    name: 'Release (dry run)'
    # yamllint disable rule:line-length
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name != github.repository)
      || (github.event_name == 'workflow_dispatch'
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    # yamllint enable rule:line-length
    permissions:
      contents: write  # Declared by the (skipped) attach and promote jobs
      id-token: write  # Declared by the (skipped) attach and publish jobs
      attestations: write  # Declared by the (skipped) attach job
      pull-requests: read  # repository-metadata-action queries PR data
      issues: read  # grype-scan-action reads cve-bypass issues
    uses: $/.github/workflows/build-test-release.yaml
    with:
      repository: 'lfreleng-actions/test-rust-project'
      ref: 'v0.1.1'
      tag: 'v0.1.1'
      dry_run: true
      binaries: true
      # Two platforms: the attach job then collects one artefact per
      # platform and names each binary after its arch.
      # yamllint disable-line rule:line-length
      runners: '[{"runner": "ubuntu-latest", "arch": "x64"}, {"runner": "ubuntu-24.04-arm", "arch": "arm64"}]'
      artefact_suffix: '-release'

  # The merge lane on a commit that adds no release file: build, test,
  # audit, scan and dry-run the publish. Skipped where the release dry
  # run is, for the same reason.
  merge-dry-run:
    name: 'Merge (dry run)'
    # yamllint disable rule:line-length
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name != github.repository)
      || (github.event_name == 'workflow_dispatch'
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    # yamllint enable rule:line-length
    permissions:
      contents: write  # Declared by the (skipped) tag job
      id-token: write  # Declared by the (skipped) publish job
      pull-requests: read  # repository-metadata-action queries PR data
      issues: read  # grype-scan-action reads cve-bypass issues
    uses: $/.github/workflows/merge.yaml
    with:
      repository: 'lfreleng-actions/test-rust-project'
      ref: 'df3d10b10c86d57e323f1042e246417baf684e7f'
      dry_run: true
      artefact_suffix: '-merge'

  # The merge lane's release path, on the fixture's merge commit that
  # adds releases/workspace-0.1.0.yaml. That version is the workspace
  # variant's, whose publishable members carry names crates.io refuses,
  # so the dry run always finds them absent. Skipped where the other dry
  # runs are, for the same reason.
  merge-release-dry-run:
    name: 'Merge release (dry run)'
    # yamllint disable rule:line-length
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name != github.repository)
      || (github.event_name == 'workflow_dispatch'
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    # yamllint enable rule:line-length
    permissions:
      contents: write  # Declared by the (skipped) tag job
      id-token: write  # Declared by the (skipped) publish job
      pull-requests: read  # repository-metadata-action queries PR data
      issues: read  # grype-scan-action reads cve-bypass issues
    uses: $/.github/workflows/merge.yaml
    with:
      repository: 'lfreleng-actions/test-rust-project'
      ref: 'bce2cc4d755482611d38a2f8f90661a89efcf4f6'
      path_prefix: 'variants/workspace'
      dry_run: true
      artefact_suffix: '-merge-release'

  # Checks what the lanes left behind, beyond their own success.
  artefacts:
    name: 'Check Artefacts'
    needs:
      - verify
      - verify-release-file
      - release-dry-run
      - merge-dry-run
      - merge-release-dry-run
    # The dry runs may skip (see above); a failure still stops this.
    # yamllint disable rule:line-length
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success'
      && needs.verify-release-file.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.release-dry-run.result)
      && contains(fromJSON('["success", "skipped"]'), needs.merge-dry-run.result)
      && contains(fromJSON('["success", "skipped"]'), needs.merge-release-dry-run.result) }}
    # yamllint enable rule:line-length
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Download artefacts'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: ${{ runner.temp }}/artefacts

      - name: 'Check the artefacts'
        shell: bash
        env:
          DIR: ${{ runner.temp }}/artefacts
          # yamllint disable-line rule:line-length
          VERIFY_HAS_RELEASE: ${{ needs.verify-release-file.outputs.has_release }}
          VERIFY_VERSION: ${{ needs.verify-release-file.outputs.version }}
          RELEASE_RAN: ${{ needs.release-dry-run.result == 'success' }}
          MERGE_RAN: ${{ needs.merge-dry-run.result == 'success' }}
          MERGE_HAS_RELEASE: ${{ needs.merge-dry-run.outputs.has_release }}
          # yamllint disable-line rule:line-length
          RELEASE_PATH_RAN: ${{ needs.merge-release-dry-run.result == 'success' }}
          # yamllint disable-line rule:line-length
          RELEASE_PATH_HAS_RELEASE: ${{ needs.merge-release-dry-run.outputs.has_release }}
          # yamllint disable-line rule:line-length
          RELEASE_PATH_VERSION: ${{ needs.merge-release-dry-run.outputs.version }}
          # yamllint disable-line rule:line-length
          RELEASE_PATH_CRATES: ${{ needs.merge-release-dry-run.outputs.crate_name }}
        run: |
          # Check the artefacts
          set -euo pipefail
          failed=0
          pass() { echo "✅ $1"; }
          miss() { echo "::error::$1"; failed=1; }

          if [ -f "$DIR/rust-lockfile-no-lockfile/Cargo.lock" ]; then
            pass 'The no-lockfile variant handed on a resolved lockfile'
          else
            miss 'The no-lockfile variant handed on no lockfile'
          fi
          if [ ! -e "$DIR/rust-lockfile-dependencies" ]; then
            pass 'A variant with a lockfile resolved none'
          else
            miss 'A variant with a lockfile resolved one anyway'
          fi
          if jq -e 'any(.components[]?; .name == "semver")' \
            "$DIR/sbom-files-dependencies/sbom-cyclonedx.json" > /dev/null
          then
            pass 'The dependencies SBOM lists the semver crate'
          else
            miss 'The dependencies SBOM lacks the semver crate'
          fi
          # A member as path_prefix with workspace: true describes every
          # workspace member, not the member alone: one merged document
          # with each member a top-level component, where a single
          # member's own SBOM would name it in metadata.component.
          long='name-too-long-for-crates-io-by-design'
          if jq -e --arg cli "lfreleng-fixture-workspace-cli-$long" \
            --arg core "lfreleng-fixture-workspace-core-$long" \
            '[.components[]?.name] as $n
             | .metadata.component.name != $cli
               and ($n | index($cli)) != null
               and ($n | index($core)) != null' \
            "$DIR/sbom-files-workspace-member/sbom-cyclonedx.json" \
            > /dev/null; then
            pass 'The workspace-member SBOM describes the whole workspace'
          else
            miss 'The workspace-member SBOM misses a workspace member'
          fi
          if [ -f "$DIR/sbom-files-root/dependency-change.json" ]; then
            pass 'The SBOM job recorded whether dependencies changed'
          else
            miss 'The SBOM job recorded no dependency change sidecar'
          fi
          if [ -f "$DIR/rust-build-x64-root/SHA256SUMS" ] \
            && [ -f "$DIR/rust-build-arm64-root/SHA256SUMS" ]; then
            pass 'Both platforms built the root crate binaries'
          else
            miss 'A platform built no root crate binaries'
          fi
          if [ -d "$DIR/rust-test-results-x64-1.85-msrv" ]; then
            pass 'The msrv variant tested the declared rust-version'
          else
            miss 'The msrv variant left no 1.85 test results'
          fi
          if [ "$VERIFY_HAS_RELEASE" = 'true' ] \
            && [ "$VERIFY_VERSION" = '0.1.0' ]; then
            pass 'The verify lane found release 0.1.0 on the fixture commit'
          else
            got="'$VERIFY_HAS_RELEASE', '$VERIFY_VERSION'"
            miss "The verify lane reported has_release, version: $got"
          fi
          if [ "$RELEASE_RAN" != 'true' ]; then
            echo "::notice::The release dry run skipped on this event"
          elif jq -e 'any(.[]; .name == "lfreleng-test-rust-project"
              and .version == "0.1.1")' \
            "$DIR/rust-build-x64-release/crates.json" > /dev/null; then
            pass 'The release rehearsal packaged crate 0.1.1'
          else
            miss 'The release rehearsal packaged no crate 0.1.1'
          fi
          assets="$DIR/release-assets-release"
          expected="$(printf '%s\n' SHA256SUMS \
            lfreleng-test-rust-project-0.1.1.crate \
            lfreleng-test-rust-project-arm64 \
            lfreleng-test-rust-project-x64 \
            sbom-cyclonedx.json sbom-cyclonedx.xml)"
          # A skipped release dry run leaves no directory, and find's
          # failure must not end the step under pipefail.
          got="$(find "$assets" -maxdepth 1 -type f -printf '%f\n' \
            2> /dev/null | LC_ALL=C sort || true)"
          if [ "$RELEASE_RAN" != 'true' ]; then
            :
          elif [ "$got" = "$expected" ] \
            && (cd "$assets" && sha256sum --quiet -c SHA256SUMS); then
            pass 'The release rehearsal collected every asset, checksummed'
          else
            miss "The release rehearsal collected: ${got//$'\n'/ }"
          fi
          if [ "$MERGE_RAN" != 'true' ]; then
            echo "::notice::The merge dry run skipped on this event"
          elif [ -f "$DIR/rust-build-x64-merge/crates.json" ]; then
            pass 'The merge run packaged its snapshot crate'
          else
            miss 'The merge run packaged no snapshot crate'
          fi
          if [ "$MERGE_RAN" != 'true' ]; then
            :
          elif [ "$MERGE_HAS_RELEASE" = 'false' ]; then
            pass 'The merge run found no release file'
          else
            miss "The merge run reported has_release: '$MERGE_HAS_RELEASE'"
          fi
          if [ "$RELEASE_PATH_RAN" != 'true' ]; then
            echo "::notice::The merge release dry run skipped on this event"
          else
            if [ "$RELEASE_PATH_HAS_RELEASE" = 'true' ] \
              && [ "$RELEASE_PATH_VERSION" = '0.1.0' ]; then
              pass 'The merge release run found release 0.1.0'
            else
              got="'$RELEASE_PATH_HAS_RELEASE', '$RELEASE_PATH_VERSION'"
              miss "The merge release run reported has_release, version: $got"
            fi
            # crate-verify reports the crates it verified; the
            # publish = false member must not be among them.
            long='name-too-long-for-crates-io-by-design'
            want="$(printf '%s\n' \
              "lfreleng-fixture-workspace-cli-$long" \
              "lfreleng-fixture-workspace-core-$long" | LC_ALL=C sort)"
            read -ra crates <<< "$RELEASE_PATH_CRATES"
            got="$(printf '%s\n' ${crates[@]+"${crates[@]}"} | LC_ALL=C sort)"
            if [ "$got" = "$want" ]; then
              pass 'The merge release run verified both publishable crates'
            else
              miss "The merge release run verified: '$RELEASE_PATH_CRATES'"
            fi
          fi
          exit "$failed"
