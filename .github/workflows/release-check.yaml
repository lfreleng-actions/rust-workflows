---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Shared release-file check for the lanes in this repository.
#
# A Model B release is a change that adds one YAML file directly under
# releases/ carrying 'version: X.Y.Z' (docs/BRIEF.md Q8), and
# optionally 'project:', the path_prefix of the lane call it releases,
# and 'git_tag:', the tag the merge creates. merge.yaml reads the file
# once the change has merged, and build-test.yaml reads it on the pull
# request or Gerrit patch set that adds it, through this one workflow,
# so what verify accepts, merge accepts too, and a file merge would
# refuse fails review instead. Called through the self-repository form
# ('$/'), as rust-metadata.yaml is. It is an internal building block:
# projects call one of the lanes, never this file.
#
# The job reports the release file's version, project and tag, and the
# commit it read. It validates every release file the change adds,
# then keeps those naming no project or this call's path_prefix, and
# fails on a malformed file, several kept files in one change, a
# version that is not a final X.Y.Z, or a version the publishable
# crates don't carry. When the tag (git_tag, or v<version> without
# one) already exists it fails or warns, as the caller chose: a review
# commit is never the one that merges, so the verify lane treats any
# existing tag as a warning.
name: '[R] Rust Release Check'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = event ref)'
        required: false
        type: string
        default: ''
      base:
        description: >-
          Commit the branch held before the change: every release file
          added since it counts, so a batched push or a pull request of
          several commits can't hide one. Empty, or a commit the
          checkout can't reach, compares the checked-out commit with its
          first parent.
        required: false
        type: string
        default: ''
      path_prefix:
        description: >-
          The lanes' path_prefix: the directory of the project the
          calling lane acts on. A release file naming another project
          is not this call's release.
        required: false
        type: string
        default: '.'
      publishable_packages:
        description: >-
          JSON array of {name, version} objects, as rust-metadata lists
          them. A release file whose version differs from any entry
          fails the check. Empty skips the comparison.
        required: false
        type: string
        default: ''
      tag_conflict:
        description: >-
          What to do when the release tag (git_tag, or v<version>)
          already names another commit:
          'fail' stops the run, 'warn' reports and carries on. 'review'
          also reports a tag that names the checked-out commit itself,
          since the commit under review is never the one that merges,
          so a release merge would still stop
        required: false
        type: string
        default: 'fail'
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
      gerrit_refspec:
        description: >-
          Gerrit refspec, or commit, to check out: the patch set under
          review, or the commit the merge lane resolved
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: 'Gerrit server URL; empty uses vars.GERRIT_URL'
        required: false
        type: string
        default: ''
    outputs:
      has_release:
        description: "'true' when the change adds a release file"
        value: ${{ jobs.check-release.outputs.has_release }}
      version:
        description: 'Version the release file names; empty without one'
        value: ${{ jobs.check-release.outputs.version }}
      file:
        description: 'Path of the release file; empty without one'
        value: ${{ jobs.check-release.outputs.file }}
      project:
        description: >-
          Project the release file names; empty for a repository-wide
          file or without one
        value: ${{ jobs.check-release.outputs.project }}
      tag:
        description: 'Tag the release creates; empty without one'
        value: ${{ jobs.check-release.outputs.tag }}
      sha:
        description: 'Commit the check read'
        value: ${{ jobs.check-release.outputs.sha }}

permissions: {}

env:
  GH_TELEMETRY: 'false'

jobs:
  check-release:
    name: 'Check for Release File'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      has_release: ${{ steps.detect.outputs.has_release }}
      version: ${{ steps.detect.outputs.version }}
      file: ${{ steps.detect.outputs.file }}
      project: ${{ steps.detect.outputs.project }}
      tag: ${{ steps.detect.outputs.tag }}
      sha: ${{ steps.detect.outputs.sha }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Check the tag_conflict input'
        shell: bash
        env:
          TAG_CONFLICT: ${{ inputs.tag_conflict }}
        run: |
          # Check the tag_conflict input
          case "$TAG_CONFLICT" in
            fail | warn | review) ;;
            *)
              echo "::error::tag_conflict: expected 'fail', 'warn' or" \
                "'review'"
              exit 1 ;;
          esac

      # Depth 2 lets diff-tree compare the commit with its parent.
      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          fetch-depth: '2'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          # A pull request is checked out at its merge commit, whose
          # first parent is its base, so depth 2 holds every commit the
          # comparison needs, as it does without a base, when the
          # commit is compared with its first parent alone. A push can
          # carry several commits, and the release file may arrive in
          # any of them, so a push with a base fetches the whole
          # history back to it. A push that creates a branch or a tag
          # names the all-zero commit as its base, which the detection
          # step treats as none, so it stays at depth 2.
          fetch-depth: >-
            ${{ inputs.base != ''
            && inputs.base != '0000000000000000000000000000000000000000'
            && github.event_name == 'push' && '0' || '2' }}
          persist-credentials: false

      # Reads the environment alone, so testing.yaml can run this same
      # script against scratch repositories and fixture commits.
      - name: 'Detect a release file in the change'
        id: detect
        shell: bash
        env:
          BASE: ${{ inputs.base }}
          PUBLISHABLE: ${{ inputs.publishable_packages }}
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Detect a release file in the change
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          no_release() {
            {
              echo "has_release=false"
              echo "version="
              echo "file="
              echo "project="
              echo "tag="
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          # A project path as the lanes compare it: without any leading
          # './' or trailing '/', and '.' for the repository root.
          normalise() {
            local path="$1"
            while [[ "$path" == ./* ]]; do path="${path#./}"; done
            while [[ "$path" == */ ]]; do path="${path%/}"; done
            printf '%s' "${path:-.}"
          }
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # The prefix lands in a notice, one workflow command per line.
          if [[ "$PATH_PREFIX" =~ [[:cntrl:]] ]]; then
            fail "path_prefix holds a control character"
          fi
          prefix="$(normalise "${PATH_PREFIX:-.}")"
          # Release files are YAML files directly under releases/. Paths
          # are read NUL-delimited: git would otherwise quote one holding
          # a space, a quote or a non-ASCII byte.
          markers=(':(glob)releases/*.yaml' ':(glob)releases/*.yml')
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$BASE" =~ [1-9a-f] ]] \
            && git merge-base --is-ancestor "$BASE" HEAD 2> /dev/null
          then
            # Every commit the change added, so a release file in an
            # earlier commit of a batched push still counts. Rename
            # detection is off: a release file renamed from an older
            # one, with a new version, is a new path under releases/,
            # and git would otherwise report it as a rename, not an
            # addition, and the release would go unseen.
            mapfile -d '' -t files < <(git diff -z --no-renames \
              --diff-filter=A --name-only "$BASE" HEAD -- "${markers[@]}")
          else
            if [ -n "$BASE" ]; then
              echo "::notice::The base is not in the checked-out history" \
                "(a new or replaced branch); comparing the commit with" \
                "its first parent"
            fi
            root=()
            if ! git rev-parse --verify --quiet 'HEAD^1' > /dev/null; then
              # No parent object: a root commit, or a checkout too
              # shallow to hold the parent the commit names.
              if git cat-file -p HEAD | grep -q '^parent '; then
                fail "The checkout lacks the commit's parent"
              fi
              root=(--root)
            fi
            mapfile -d '' -t files < <(git diff-tree -z --no-renames -m \
              --first-parent --diff-filter=A --no-commit-id -r --name-only \
              ${root[@]+"${root[@]}"} HEAD -- "${markers[@]}")
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release file in the change"
            no_release
          fi
          yaml_errors="$RUNNER_TEMP/release-yaml.err"
          number='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          # A tag name: a plain character set, and no empty, '.'-led or
          # '.lock'-ended path component, nor '..', which git refuses.
          export TAG_CHARS='^[A-Za-z0-9._/-]+$'
          export TAG_EMPTY='(^|/)(/|$)'
          export TAG_DOT='(^|/)[.]'
          export TAG_LOCK='[.]lock(/|$)'
          export TAG_DOTS='[.][.]'
          # Every file is checked, whichever project it names, so a
          # malformed file fails every call that sees it; then only the
          # files naming no project, or this call's, are its release.
          selected=()
          for file in "${files[@]}"; do
            # The name lands in GITHUB_OUTPUT, one record per line,
            # where a newline in it could forge the recorded commit;
            # keep names to a plain set.
            [[ "$file" =~ ^releases/[A-Za-z0-9._-]+\.ya?ml$ ]] \
              || fail "Release file names use letters, digits, '.', '_'" \
                "and '-' alone"
            # A regular file, in the commit and on disk: a symlink could
            # request a release with content from outside the file.
            mode="$(git ls-tree HEAD -- "$file" | cut -d' ' -f1)"
            case "$mode" in
              100644 | 100755) ;;
              *) fail "$file must be a regular file" ;;
            esac
            if [ ! -f "$file" ] || [ -L "$file" ]; then
              fail "$file must be a regular file"
            fi
            # One YAML document holding a mapping with exactly one
            # top-level 'version' key, read by a YAML parser (yq ships
            # on the runner image): a file YAML can't parse, a second
            # document, a duplicate key, or a value such as 1.2.0#rc,
            # which YAML reads as one scalar since '#' opens a comment
            # only after a space, fails here rather than reading as
            # something else. The value must be a final X.Y.Z.
            if ! documents="$(yq eval-all '[.] | length' "$file" \
                2> "$yaml_errors")"; then
              fail "$file is not valid YAML: $(head -c 300 "$yaml_errors")"
            fi
            [ "$documents" -eq 1 ] \
              || fail "$file holds $documents YAML documents; one is expected"
            yq -e 'tag == "!!map"' "$file" > /dev/null 2>&1 \
              || fail "$file must be a YAML mapping"
            keys="$(yq 'to_entries | map(select(.key == "version"))
              | length' "$file")"
            [ "$keys" -eq 1 ] \
              || fail "$file needs exactly one top-level 'version' key"
            # The parser tests the scalar itself, so a quoted trailing
            # newline, which a shell substitution would strip, fails too.
            NUMBER="$number" yq -e \
              '.version | (tag == "!!str" and test(strenv(NUMBER)))' \
              "$file" > /dev/null 2>&1 \
              || fail "$file needs 'version: X.Y.Z', a final release"
            version="$(yq '.version' "$file")"
            # An optional 'project': the path_prefix of the lane call
            # the file releases. Without one, the file applies to every
            # call, as a repository-wide release.
            keys="$(yq 'to_entries | map(select(.key == "project"))
              | length' "$file")"
            [ "$keys" -le 1 ] \
              || fail "$file holds more than one top-level 'project' key"
            project=''
            if [ "$keys" -eq 1 ]; then
              yq -e '.project | (tag == "!!str" and . != ""
                and (test("[[:cntrl:]]") | not))' \
                "$file" > /dev/null 2>&1 \
                || fail "$file needs 'project' to name a directory" \
                  "relative to the repository root"
              # A leading '/' is tested on the raw value: normalising
              # '/' or '//' would leave the root's '.'.
              project="$(yq '.project' "$file")"
              [[ "$project" == /* ]] || project="$(normalise "$project")"
              if [[ "$project" == /* ]] || [[ "/$project/" == */../* ]]
              then
                fail "$file needs 'project' to name a directory" \
                  "relative to the repository root"
              fi
            fi
            # An optional 'git_tag': the tag the merge creates, which
            # ends with the version so a tag always names its release.
            keys="$(yq 'to_entries | map(select(.key == "git_tag"))
              | length' "$file")"
            [ "$keys" -le 1 ] \
              || fail "$file holds more than one top-level 'git_tag' key"
            tag="v$version"
            if [ "$keys" -eq 1 ]; then
              yq -e '.git_tag | (tag == "!!str"
                and test(strenv(TAG_CHARS))
                and (test(strenv(TAG_EMPTY)) | not)
                and (test(strenv(TAG_DOT)) | not)
                and (test(strenv(TAG_LOCK)) | not)
                and (test(strenv(TAG_DOTS)) | not))' \
                "$file" > /dev/null 2>&1 \
                || fail "$file needs 'git_tag' to be a tag name of" \
                  "letters, digits, '.', '_', '-' and '/', with no" \
                  "empty, '.'-led or '.lock'-ended component"
              tag="$(yq '.git_tag' "$file")"
              [[ "$tag" == *"$version" ]] \
                || fail "$file names git_tag $tag, which does not end" \
                  "with its version $version"
            fi
            if [ -z "$project" ] || [ "$project" = "$prefix" ]; then
              selected+=("$file")
              release_version="$version"
              release_project="$project"
              release_tag="$tag"
            else
              echo "::notice::$file names project $project," \
                "not this call's $prefix"
            fi
          done
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "No release file for project $prefix in the change"
            no_release
          fi
          # One release per project per change: several files would
          # make the version an arbitrary choice.
          if [ "${#selected[@]}" -gt 1 ]; then
            fail "The change adds ${#selected[@]} release files for this" \
              "project; add one per change"
          fi
          file="${selected[0]}"
          version="$release_version"
          project="$release_project"
          tag="$release_tag"
          echo "Release $version from $file, tagged $tag"
          # Every publishable crate must carry the version, as
          # crate-verify requires of a release merge; name each one
          # that doesn't, so the fix is one edit.
          if [ -n "$PUBLISHABLE" ]; then
            jq -e 'type == "array" and all(.[]; type == "object"
              and (.name | type) == "string"
              and (.version | type) == "string")' \
              <<< "$PUBLISHABLE" > /dev/null 2>&1 \
              || fail "publishable_packages is not a JSON array of" \
                "{name, version} objects"
            differing="$(jq -r --arg version "$version" \
              '[.[] | select(.version != $version)
                | "\(.name) \(.version)"] | join(", ")' <<< "$PUBLISHABLE")"
            if [ -n "$differing" ]; then
              fail "$file releases $version, but these crates carry" \
                "another version: $differing"
            fi
            count="$(jq length <<< "$PUBLISHABLE")"
            if [ "$count" -gt 0 ]; then
              echo "Every publishable crate carries $version ✅"
            fi
          fi
          {
            echo "has_release=true"
            echo "version=$version"
            echo "file=$file"
            echo "project=$project"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "## 🦀 Release $version ($tag) requested by \`$file\`" \
            >> "$GITHUB_STEP_SUMMARY"

      # A crates.io version is permanent, so a release tag that already
      # names other source stops a merge here, before anything builds
      # or publishes: an earlier run may have tagged the version without
      # publishing it. The merge lane's tag job repeats the check for
      # races. A dry run, which publishes and tags nothing, reports the
      # conflict as a warning and carries on; so does the verify lane,
      # for any existing tag, since the commit it checks is never the
      # one that merges.
      - name: 'Check the release tag'
        if: steps.detect.outputs.has_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
          TAG: ${{ steps.detect.outputs.tag }}
          SHA: ${{ steps.detect.outputs.sha }}
          TAG_CONFLICT: ${{ inputs.tag_conflict }}
        run: |
          # Check the release tag
          set -euo pipefail
          errors="$RUNNER_TEMP/tag-lookup.err"
          stop() {
            if [ "$TAG_CONFLICT" != 'fail' ]; then
              echo "::warning::$*; a release merge would stop here"
              exit 0
            fi
            echo "::error::$*"
            exit 1
          }
          if existing="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object.type + " " + .object.sha' 2> "$errors")"; then
            target="${existing#* }"
            if [ "${existing%% *}" = 'tag' ]; then
              # An annotated tag: the ref names a tag object, which
              # names the commit. A failed read leaves the tag as
              # unknown as a failed lookup does, so it stops the same
              # way rather than fail the run under every policy.
              target="$(gh api "repos/$REPOSITORY/git/tags/$target" \
                --jq .object.sha 2> "$errors")" \
                || stop "Could not read the tag object $TAG names:" \
                  "$(head -c 300 "$errors")"
            fi
            if [ "$target" != "$SHA" ]; then
              stop "$TAG already exists on $target, not $SHA." \
                "Release a new version"
            fi
            if [ "$TAG_CONFLICT" = 'review' ]; then
              # The commit under review never merges as itself, so a
              # tag on it still names other source than the release.
              stop "$TAG already exists, on the commit under review;" \
                "the merged commit will be another one"
            fi
            echo "$TAG already names $SHA ✅"
          elif grep -q 'HTTP 404' "$errors"; then
            echo "$TAG is free ✅"
          else
            # Anything but 'not found' leaves the tag unknown: stop
            # rather than publish past a tag that may exist.
            stop "Could not look up $TAG: $(head -c 300 "$errors")"
          fi
