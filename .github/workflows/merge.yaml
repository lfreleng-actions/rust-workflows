---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Rust merge pipeline: the merge lane (Model B).
#
# Runs on every merge to a protected branch: a push to it, or a Gerrit
# change-merged dispatch. crates.io has no snapshots and its versions
# are immutable, so every merge proves the commit publishable without
# spending a version, and a release happens only when the merged change
# adds a release file under releases/ (-> denotes sequence):
#   resolve-commit -> check-release -> rust-metadata -> build
#     -> { tests | audit | sbom -> grype }
#     -> crate-verify -> publish -> tag (release merges only)
#
# crate-verify dry-runs the publish on every merge; its packaged crates
# stay a workflow artefact (the build's rust-build-<arch> artefact).
# On a release merge it also requires every crate version to equal the
# release file's version, and publish then uploads exactly the archives
# it verified. The tag job creates the release file's git_tag, or
# v<version> without one, on the merged commit once the crates are on
# crates.io.
#
# resolve-commit asks Gerrit for the commit a change-merged dispatch
# merged, and check-release records the merged commit once; every
# later job checks out that commit, so a merge landing before or
# during the run cannot give two jobs different trees, nor hide this
# merge's release file.
#
# The publish job runs from the branch commit, before any tag exists,
# so restrict publish_environment to the protected branch, and register
# the caller's file and that environment as a crates.io trusted
# publisher. A project running both release models uses two
# environments (docs/BRIEF.md Q8).
#
# Call this from a thin caller workflow; see examples/merge/ for both
# caller forms.
name: '[R] Rust Merge'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = event ref)'
        required: false
        type: string
        default: ''

      # --- Project selection ---
      path_prefix:
        description: 'Directory holding the project'
        required: false
        type: string
        default: '.'
      manifest_path:
        description: 'Cargo.toml to act on, relative to path_prefix'
        required: false
        type: string
        default: 'Cargo.toml'
      workspace:
        description: >-
          Act on every workspace member (--workspace), and publish every
          member whose 'publish' setting admits crates.io
        required: false
        type: boolean
        default: true
      packages:
        description: 'Whitespace-separated packages; replaces workspace'
        required: false
        type: string
        default: ''
      exclude:
        description: 'Members to skip; needs workspace and no packages'
        required: false
        type: string
        default: ''
      features:
        description: 'Features to enable, separated by spaces or commas'
        required: false
        type: string
        default: ''
      all_features:
        description: 'Enable every feature (--all-features)'
        required: false
        type: boolean
        default: false
      no_default_features:
        description: 'Disable default features (--no-default-features)'
        required: false
        type: boolean
        default: false

      # --- Toolchain and environment ---
      toolchain:
        description: >-
          Toolchain for every job. Empty uses the project's toolchain
          file, or stable without one. A moving channel resolves to an
          exact release once per run.
        required: false
        type: string
        default: ''
      lockfile_required:
        description: >-
          Fail when the project commits no Cargo.lock. Publishing
          packages with --locked, so a release needs the lockfile.
        required: false
        type: boolean
        default: true
      setup_script:
        description: >-
          Committed script, relative to path_prefix, run with bash
          before cargo in the jobs that compile (native libraries)
        required: false
        type: string
        default: ''
      runners:
        description: >-
          JSON array of {runner, arch} objects; build and tests run once
          per entry
        required: false
        type: string
        default: '[{"runner": "ubuntu-latest", "arch": "x64"}]'

      # --- Build ---
      target:
        description: 'Target triple to build for; empty builds for the host'
        required: false
        type: string
        default: ''
      profile:
        description: 'Cargo profile: dev, release or a custom profile'
        required: false
        type: string
        default: 'release'
      cargo_args:
        description: "Extra 'cargo build' arguments, split on whitespace"
        required: false
        type: string
        default: ''
      binaries:
        description: 'Collect built binaries, with SHA256SUMS, as an artefact'
        required: false
        type: boolean
        default: false
      auditable:
        description: "Build binaries with 'cargo auditable'; needs binaries"
        required: false
        type: boolean
        default: false
      build_timeout_minutes:
        description: 'Timeout for each build job'
        required: false
        type: number
        default: 20

      # --- Tests ---
      tests_enabled:
        description: 'Run the test jobs (set false to skip)'
        required: false
        type: boolean
        default: true
      test_matrix:
        description: >-
          'project' tests the project toolchain; 'msrv' adds the declared
          rust-version; 'full' adds recent stable minors and stable.
        required: false
        type: string
        default: 'msrv'
      test_runner:
        description: "'cargo' (cargo test) or 'nextest' (cargo nextest run)"
        required: false
        type: string
        default: 'cargo'
      test_args:
        description: 'Extra test runner arguments, split on whitespace'
        required: false
        type: string
        default: ''
      doc_tests:
        description: 'Run doc tests'
        required: false
        type: boolean
        default: true
      coverage:
        description: 'Measure coverage with cargo-llvm-cov (project leg)'
        required: false
        type: boolean
        default: false
      test_permit_fail:
        description: 'Permit test failures without failing the job'
        required: false
        type: boolean
        default: false
      test_timeout_minutes:
        description: 'Timeout for each test job'
        required: false
        type: number
        default: 20

      # --- Audit ---
      audit_enabled:
        description: 'Run the cargo-audit job (set false to skip)'
        required: false
        type: boolean
        default: true
      audit_permit_fail:
        description: 'Permit audit failures without failing the job'
        required: false
        type: boolean
        default: false
      audit_ignore_vulns:
        description: 'RUSTSEC advisory IDs to ignore, whitespace-separated'
        required: false
        type: string
        default: ''
      audit_allow_list_path:
        description: 'File of RUSTSEC IDs to ignore, relative to path_prefix'
        required: false
        type: string
        default: ''
      deny_enabled:
        description: 'Also run cargo-deny in the audit job'
        required: false
        type: boolean
        default: false
      deny_checks:
        description: 'cargo-deny checks: advisories bans licenses sources'
        required: false
        type: string
        default: 'advisories bans licenses sources'
      audit_timeout_minutes:
        description: 'Timeout for the audit, SBOM and Grype jobs'
        required: false
        type: number
        default: 10

      # --- SBOM and Grype ---
      sbom_enabled:
        description: >-
          Generate an SBOM of the merged commit (set false to skip).
          Skipping it skips the Grype scan too.
        required: false
        type: boolean
        default: true
      sbom_format:
        description: "SBOM output format: 'json', 'xml' or 'both'"
        required: false
        type: string
        default: 'both'
      sbom_include_dev:
        description: >-
          Include Cargo build-dependencies in the SBOM. Dev-dependencies
          never ship with a crate, so the SBOM leaves them out either
          way.
        required: false
        type: boolean
        default: false
      grype_enabled:
        description: >-
          Scan the merged commit's SBOM with Grype. Merges gate on every
          finding, whatever changed, so a CVE published since the last
          pull request surfaces here.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: >-
          Lowest severity that fails the scan: negligible, low, medium,
          high or critical; 'none' reports without gating
        required: false
        type: string
        default: 'medium'
      grype_dependency_policy:
        description: >-
          Which Grype findings gate: 'all' gates every finding; 'declared'
          gates the crates the project declares and reports inherited
          ones as warnings, subject to grype_transitive_fail_on
        required: false
        type: string
        default: 'all'
      grype_transitive_fail_on:
        description: >-
          Under grype_dependency_policy 'declared', the lowest severity
          at which an inherited crate gates: negligible, low, medium,
          high or critical; 'none' never gates on one
        required: false
        type: string
        default: 'none'
      grype_permit_fail:
        description: >-
          Report Grype findings without failing the job. When false,
          falls back to the NO_BLOCK_AUDIT_FAIL repository variable.
        required: false
        type: boolean
        default: false
      grype_only_fixed:
        description: 'Report only vulnerabilities that have a fix'
        required: false
        type: boolean
        default: false

      # --- Release ---
      semver_checks:
        description: >-
          Run cargo-semver-checks against the latest earlier crates.io
          release on a release merge
        required: false
        type: boolean
        default: false
      publish_enabled:
        description: >-
          Publish the verified crates to crates.io on a release merge,
          through Trusted Publishing. Off by default: register the
          trusted publisher first.
        required: false
        type: boolean
        default: false
      publish_environment:
        description: >-
          Environment the publish job runs in; the crates.io trusted
          publisher must name it. Restrict it to the protected branch.
        required: false
        type: string
        default: 'production'
      create_tag:
        description: >-
          Create the release tag (the release file's git_tag, or
          v<version>) on the merged commit after a release publishes.
          Gerrit projects tag in Gerrit instead: set false.
        required: false
        type: boolean
        default: true
      dry_run:
        description: >-
          Verify everything, including a release file's version, but
          publish and tag nothing
        required: false
        type: boolean
        default: false

      # --- Artefacts ---
      artefact_suffix:
        description: >-
          Suffix for every artefact this run uploads, such as '-core',
          so several calls in one workflow run cannot clash: empty, or
          '-' and up to 64 letters, digits, '.', '_' or '-'
        required: false
        type: string
        default: ''

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
      harden_runner_supplemental_allowlist:
        description: >-
          Extra harden-runner allow-list merged with
          harden_runner_allowlist, in the same coordinate grammar.
          Empty adds nothing
        required: false
        type: string
        default: ''
      harden_runner_supplemental_unpinned:
        description: >-
          Let harden_runner_supplemental_allowlist omit '@ref' and
          follow its default branch; only a list in the caller's own
          organisation qualifies
        required: false
        type: boolean
        default: false

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: >-
          Gerrit refspec of the merged change: normally the branch ref
          a change-merged event carries, or a change ref to re-run an
          already-merged change. Resolved once, so every job checks out
          the same commit; it must be on gerrit_branch.
        required: false
        type: string
        default: ''
      gerrit_patchset_revision:
        description: >-
          The triggering change's revision (GERRIT_PATCHSET_REVISION).
          Pins the run to the commit that merged it; without it a
          branch refspec checks out whatever the branch tip is when the
          run resolves it.
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

    outputs:
      has_release:
        description: "'true' when the merged commit added a release file"
        value: ${{ jobs.check-release.outputs.has_release }}
      version:
        description: 'Version the release file names; empty without one'
        value: ${{ jobs.check-release.outputs.version }}
      project:
        description: >-
          Project the release file names; empty for a repository-wide
          file or without one
        value: ${{ jobs.check-release.outputs.project }}
      crate_name:
        description: 'Verified crate names, space-separated, publish order'
        value: ${{ jobs.crate-verify.outputs.crate_name }}
      crate_sha256:
        description: 'Verified crate digest; several crates: a JSON object'
        value: ${{ jobs.crate-verify.outputs.crate_sha256 }}
      publish_status:
        description: "'published', 'skipped' or 'failed'; empty unpublished"
        value: ${{ jobs.publish.outputs.publish_status }}
      tag:
        description: >-
          Tag the release creates on the merged commit, or would create
          on a dry run or without create_tag; empty without a release
        value: ${{ jobs.check-release.outputs.tag }}

permissions: {}

env:
  GH_TELEMETRY: 'false'

jobs:
  gerrit-validate:
    name: 'Validate Inputs'
    # Fails fast on inputs the jobs would otherwise reject one by one.
    # This job always runs (only its steps are conditional), so gating
    # dependents on it does not trip GitHub's "skipped need skips
    # dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # Require Gerrit project, branch and URL
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

      - name: 'Require a baseline for the supplemental allow-list'
        # harden-runner-block-action refuses a supplemental list without
        # a baseline 'config'; fail once here rather than in every job.
        if: inputs.harden_runner_supplemental_allowlist != ''
        shell: bash
        env:
          BASELINE: ${{ inputs.harden_runner_allowlist }}
        run: |
          # Require a baseline for the supplemental allow-list
          if [ -z "${BASELINE}" ]; then
            echo "::error::harden_runner_supplemental_allowlist is set" \
              "but harden_runner_allowlist is empty; the supplemental" \
              "list extends a baseline and cannot replace it"
            exit 1
          fi
          echo "Supplemental allow-list has a baseline ✅"

      - name: 'Check the merge inputs'
        shell: bash
        env:
          TEST_RUNNER: ${{ inputs.test_runner }}
          ARTEFACT_SUFFIX: ${{ inputs.artefact_suffix }}
          SBOM_FORMAT: ${{ inputs.sbom_format }}
          GRYPE_FAIL_ON: ${{ inputs.grype_fail_on }}
          GRYPE_DEPENDENCY_POLICY: ${{ inputs.grype_dependency_policy }}
          GRYPE_TRANSITIVE_FAIL_ON: ${{ inputs.grype_transitive_fail_on }}
          PUBLISH_ENABLED: ${{ inputs.publish_enabled }}
          PUBLISH_ENVIRONMENT: ${{ inputs.publish_environment }}
        run: |
          # Check the merge inputs
          failed=0
          error() { echo "::error::$*"; failed=1; }
          check() {
            local name="$1" value="$2" allowed=" $3 "
            case "$allowed" in
              *" $value "*) ;;
              *) error "$name: expected one of:$allowed" ;;
            esac
          }
          check test_runner "$TEST_RUNNER" 'cargo nextest'
          check sbom_format "$SBOM_FORMAT" 'json xml both'
          check grype_fail_on "$GRYPE_FAIL_ON" \
            'negligible low medium high critical none'
          check grype_dependency_policy "$GRYPE_DEPENDENCY_POLICY" \
            'all declared'
          check grype_transitive_fail_on "$GRYPE_TRANSITIVE_FAIL_ON" \
            'negligible low medium high critical none'
          if [ "$PUBLISH_ENABLED" = 'true' ] \
            && [ -z "$PUBLISH_ENVIRONMENT" ]; then
            error "publish_enabled needs publish_environment: crates.io" \
              "trusted publishers should name an environment"
          fi
          if ! [[ "$ARTEFACT_SUFFIX" =~ ^(-[A-Za-z0-9._-]{1,64})?$ ]]; then
            echo "::error::artefact_suffix: expected '' or '-' and up to" \
              "64 of A-Z a-z 0-9 . _ -"
            failed=1
          fi
          exit "$failed"

  # Resolve, once, the commit a Gerrit dispatch checks out, as
  # node-workflows does (its #119).
  #
  # A change-merged event's refspec is usually the branch ref, and
  # checking that out means getting whatever the branch tip is when
  # the run starts. A dispatch that waits behind an earlier run sees a
  # later merge's commit instead, compares that with its first parent,
  # and misses its own release file. check-release, and through its
  # sha output every later job, checks out the SHA resolved here.
  #
  # Resolution asks Gerrit, never the mirror, and starts from the
  # triggering revision (gerrit_patchset_revision) when the caller
  # forwards it. Under a merge-if-necessary or merge-always submit
  # type that revision need not be the commit on the branch: Gerrit
  # may have merged it with a merge commit. So the merged commit is
  # the first-parent commit that brought the revision onto the branch,
  # the revision itself when it was fast-forwarded.
  #
  # The revision must be on the target branch. Re-dispatching a
  # merged release change by its change ref is a legitimate recovery;
  # an unmerged patchset would publish code nobody merged, so the job
  # refuses it.
  resolve-commit:
    name: 'Resolve Commit'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    # Reads Gerrit over HTTPS and checks nothing out
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
      - name: 'Harden runner'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # The GitHub-native path checks out inputs.ref, or the pushed
      # commit; check-release resolves that, so there is nothing to do.
      - name: 'Resolve the merged commit'
        id: resolve
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_REFSPEC: ${{ inputs.gerrit_refspec }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          REVISION: ${{ inputs.gerrit_patchset_revision }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
        run: |
          # Resolve the triggering revision against Gerrit's branch
          if [ -n "${REVISION}" ] \
            && [[ ! "${REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::gerrit_patchset_revision must be a full" \
              "40-character commit SHA"
            exit 1
          fi
          repo="${RUNNER_TEMP}/resolve-commit"
          rm -rf "${repo}"
          git init -q "${repo}"
          cd "${repo}"
          remote="${GERRIT_URL}/${GERRIT_PROJECT}"
          branch_ref='refs/remotes/gerrit/branch'
          # The whole branch history: mapping a revision to the commit
          # that merged it, and proving ancestry, both walk it
          if ! git fetch -q --no-tags -- "${remote}" \
            "+refs/heads/${GERRIT_BRANCH}:${branch_ref}" 2> /dev/null; then
            echo "::error::Cannot fetch ${GERRIT_BRANCH} from Gerrit"
            exit 1
          fi
          if [ -n "${REVISION}" ]; then
            revision="${REVISION}"
            if ! git cat-file -e "${revision}^{commit}" 2> /dev/null \
              && ! git fetch -q --no-tags -- "${remote}" \
                "${revision}" 2> /dev/null; then
              echo "::error::Gerrit does not serve revision" \
                "${revision}"
              exit 1
            fi
          elif [ "${GERRIT_REFSPEC}" = "refs/heads/${GERRIT_BRANCH}" ]; then
            # No triggering revision to anchor on: the branch tip is
            # the closest available, but a merge landing between the
            # event and this job moves it. Forward
            # GERRIT_PATCHSET_REVISION to pin the exact change.
            echo "::notice::No gerrit_patchset_revision; building the" \
              "current tip of ${GERRIT_BRANCH}"
            revision=$(git rev-parse "${branch_ref}")
          else
            if ! git fetch -q --no-tags -- "${remote}" \
              "${GERRIT_REFSPEC}" 2> /dev/null; then
              echo "::error::Cannot fetch ${GERRIT_REFSPEC} from Gerrit"
              exit 1
            fi
            revision=$(git rev-parse 'FETCH_HEAD^{commit}')
          fi
          if ! git merge-base --is-ancestor "${revision}" "${branch_ref}"
          then
            echo "::error::Revision ${revision} is not on" \
              "${GERRIT_BRANCH}; refusing to build or publish an" \
              "unmerged change"
            exit 1
          fi
          # The commit Gerrit put on the branch for this revision: the
          # revision itself when fast-forwarded, otherwise the oldest
          # first-parent commit descending from it, i.e. its merge.
          # Listed into a variable rather than piped to grep -q, which
          # can exit early and SIGPIPE rev-list under pipefail.
          mainline=$(git rev-list --first-parent "${branch_ref}")
          if grep -qx "${revision}" <<< "${mainline}"; then
            commit="${revision}"
          else
            commit=$(git rev-list --first-parent \
              --ancestry-path="${revision}" \
              "${revision}..${branch_ref}" | tail -n 1)
          fi
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot find the commit that merged" \
              "${revision} onto ${GERRIT_BRANCH}"
            exit 1
          fi
          echo "Building ${commit} (merged ${revision} on" \
            "${GERRIT_BRANCH})"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

  repository-metadata:
    name: 'Repository Metadata'
    needs: resolve-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ needs.resolve-commit.outputs.commit }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@2206d754f65f1a90f57b49be546712c5f594def2  # v0.3.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  rust-metadata:
    name: 'Rust Metadata'
    needs: check-release
    permissions:
      contents: read
    uses: $/.github/workflows/rust-metadata.yaml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ needs.check-release.outputs.sha }}
      path_prefix: ${{ inputs.path_prefix }}
      manifest_path: ${{ inputs.manifest_path }}
      workspace: ${{ inputs.workspace }}
      packages: ${{ inputs.packages }}
      exclude: ${{ inputs.exclude }}
      toolchain: ${{ inputs.toolchain }}
      test_matrix: ${{ inputs.test_matrix }}
      runners: ${{ inputs.runners }}
      lockfile_required: ${{ inputs.lockfile_required }}
      harden_runner_egress: ${{ inputs.harden_runner_egress }}
      harden_runner_allowlist: ${{ inputs.harden_runner_allowlist }}
      # yamllint disable-line rule:line-length
      harden_runner_supplemental_allowlist: ${{ inputs.harden_runner_supplemental_allowlist }}
      # yamllint disable-line rule:line-length
      harden_runner_supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned }}
      # yamllint disable-line rule:line-length
      gerrit_refspec: ${{ inputs.gerrit_refspec != '' && needs.check-release.outputs.sha || '' }}
      gerrit_project: ${{ inputs.gerrit_project }}
      gerrit_branch: ${{ inputs.gerrit_branch }}
      gerrit_url: ${{ inputs.gerrit_url }}
      artefact_suffix: ${{ inputs.artefact_suffix }}

  # A release is a merged commit that adds one file under releases/
  # carrying a 'version: X.Y.Z' line. Merge commits compare with their
  # first parent, so a merged branch counts as one change. This job
  # also records the commit every later job checks out: on the Gerrit
  # path, the one resolve-commit chose. The check itself lives in
  # release-check.yaml, which the verify lane runs on the change that
  # adds the file, so a file this job would refuse fails review first.
  # The version comparison with the crates waits for crate-verify here,
  # as rust-metadata reads the commit this job records.
  check-release:
    name: 'Check for Release File'
    needs: resolve-commit
    permissions:
      contents: read
    uses: $/.github/workflows/release-check.yaml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      # The commit the branch held before this push, when the run is
      # a push to the repository it checks out. Gerrit dispatches and
      # explicit refs compare the tip with its first parent instead.
      # yamllint disable-line rule:line-length
      base: ${{ github.event_name == 'push' && inputs.gerrit_refspec == '' && inputs.ref == '' && (inputs.repository == '' || inputs.repository == github.repository) && github.event.before || '' }}
      # A release file naming another project is not this call's.
      path_prefix: ${{ inputs.path_prefix }}
      # A dry run publishes and tags nothing, so a taken tag is a
      # warning and the rehearsal carries on.
      tag_conflict: ${{ inputs.dry_run && 'warn' || 'fail' }}
      harden_runner_egress: ${{ inputs.harden_runner_egress }}
      harden_runner_allowlist: ${{ inputs.harden_runner_allowlist }}
      # yamllint disable-line rule:line-length
      harden_runner_supplemental_allowlist: ${{ inputs.harden_runner_supplemental_allowlist }}
      # yamllint disable-line rule:line-length
      harden_runner_supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned }}
      # The Gerrit path checks out the commit resolve-commit chose,
      # never the branch tip, which a later merge may already have
      # moved.
      # yamllint disable-line rule:line-length
      gerrit_refspec: ${{ inputs.gerrit_refspec != '' && needs.resolve-commit.outputs.commit || '' }}
      gerrit_project: ${{ inputs.gerrit_project }}
      gerrit_branch: ${{ inputs.gerrit_branch }}
      gerrit_url: ${{ inputs.gerrit_url }}

  build:
    name: 'Build (${{ matrix.platform.arch }})'
    needs:
      - check-release
      - rust-metadata
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.rust-metadata.outputs.runners) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ needs.check-release.outputs.sha }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ needs.check-release.outputs.sha }}
          persist-credentials: false

      - name: 'Restore the resolved lockfile'
        if: needs.rust-metadata.outputs.lockfile_generated == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.rust-metadata.outputs.lockfile_artefact }}
          path: ${{ needs.rust-metadata.outputs.lockfile_dir }}

      # The packaged crates in this artefact are the merge's snapshot:
      # crates.io has no snapshot channel (docs/BRIEF.md Q8).
      - name: 'Build'
        id: build
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/rust-build-action@06de2240463f32df4f3a8262c518aa8ea873057e  # v0.1.0
        with:
          path_prefix: ${{ inputs.path_prefix }}
          manifest_path: ${{ inputs.manifest_path }}
          workspace: ${{ inputs.workspace }}
          packages: ${{ inputs.packages }}
          exclude: ${{ inputs.exclude }}
          features: ${{ inputs.features }}
          all_features: ${{ inputs.all_features }}
          no_default_features: ${{ inputs.no_default_features }}
          toolchain: ${{ needs.rust-metadata.outputs.toolchain }}
          # yamllint disable-line rule:line-length
          toolchain_components: ${{ needs.rust-metadata.outputs.toolchain_components }}
          # yamllint disable-line rule:line-length
          toolchain_targets: ${{ needs.rust-metadata.outputs.toolchain_targets }}
          lockfile_required: ${{ inputs.lockfile_required }}
          setup_script: ${{ inputs.setup_script }}
          target: ${{ inputs.target }}
          profile: ${{ inputs.profile }}
          cargo_args: ${{ inputs.cargo_args }}
          binaries: ${{ inputs.binaries }}
          auditable: ${{ inputs.auditable }}
          # yamllint disable-line rule:line-length
          package_crates: ${{ strategy.job-index == 0 && needs.rust-metadata.outputs.publishable_count != '0' }}
          # yamllint disable-line rule:line-length
          artefact_name: rust-build-${{ matrix.platform.arch }}${{ inputs.artefact_suffix }}

  tests:
    name: 'Tests (${{ matrix.platform.arch }}, ${{ matrix.rust.label }})'
    needs:
      - check-release
      - rust-metadata
      - build
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.tests_enabled }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.rust-metadata.outputs.runners) }}
        rust: ${{ fromJSON(needs.rust-metadata.outputs.test_matrix) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.test_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ needs.check-release.outputs.sha }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ needs.check-release.outputs.sha }}
          persist-credentials: false

      - name: 'Restore the resolved lockfile'
        if: needs.rust-metadata.outputs.lockfile_generated == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.rust-metadata.outputs.lockfile_artefact }}
          path: ${{ needs.rust-metadata.outputs.lockfile_dir }}

      - name: 'Run tests'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/rust-test-action@8e69a16038a3c4d0cf710c81039094b0ad9feb40  # v0.0.1
        with:
          path_prefix: ${{ inputs.path_prefix }}
          manifest_path: ${{ inputs.manifest_path }}
          workspace: ${{ inputs.workspace }}
          packages: ${{ inputs.packages }}
          exclude: ${{ inputs.exclude }}
          features: ${{ inputs.features }}
          all_features: ${{ inputs.all_features }}
          no_default_features: ${{ inputs.no_default_features }}
          toolchain: ${{ matrix.rust.toolchain }}
          # yamllint disable-line rule:line-length
          toolchain_components: ${{ needs.rust-metadata.outputs.toolchain_components }}
          # yamllint disable-line rule:line-length
          toolchain_targets: ${{ needs.rust-metadata.outputs.toolchain_targets }}
          lockfile_required: ${{ inputs.lockfile_required }}
          setup_script: ${{ inputs.setup_script }}
          test_runner: ${{ inputs.test_runner }}
          test_args: ${{ inputs.test_args }}
          doc_tests: ${{ inputs.doc_tests }}
          # yamllint disable-line rule:line-length
          coverage: ${{ inputs.coverage && matrix.rust.label == 'project' }}
          # yamllint disable-line rule:line-length
          artefact_name: rust-test-results-${{ matrix.platform.arch }}-${{ matrix.rust.label }}${{ inputs.artefact_suffix }}
          permit_fail: ${{ inputs.test_permit_fail }}

  audit:
    name: 'Audit Dependencies'
    needs:
      - check-release
      - rust-metadata
      - build
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.audit_enabled }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ needs.check-release.outputs.sha }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ needs.check-release.outputs.sha }}
          persist-credentials: false

      - name: 'Restore the resolved lockfile'
        if: needs.rust-metadata.outputs.lockfile_generated == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.rust-metadata.outputs.lockfile_artefact }}
          path: ${{ needs.rust-metadata.outputs.lockfile_dir }}

      - name: 'Audit dependencies'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/rust-audit-action@fa19bd4be915071d8c6fdf3d51b95a754fa79e1d  # v0.0.1
        with:
          path_prefix: ${{ inputs.path_prefix }}
          manifest_path: ${{ inputs.manifest_path }}
          toolchain: ${{ needs.rust-metadata.outputs.toolchain }}
          lockfile_required: ${{ inputs.lockfile_required }}
          ignore_vulns: ${{ inputs.audit_ignore_vulns }}
          allow_list_path: ${{ inputs.audit_allow_list_path }}
          deny_enabled: ${{ inputs.deny_enabled }}
          deny_checks: ${{ inputs.deny_checks }}
          artefact_name: rust-audit-results${{ inputs.artefact_suffix }}
          permit_fail: ${{ inputs.audit_permit_fail }}

  sbom:
    name: 'Generate SBOM'
    needs:
      - check-release
      - rust-metadata
      - build
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.sbom_enabled }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ needs.check-release.outputs.sha }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ needs.check-release.outputs.sha }}
          persist-credentials: false

      - name: 'Restore the resolved lockfile'
        if: needs.rust-metadata.outputs.lockfile_generated == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.rust-metadata.outputs.lockfile_artefact }}
          path: ${{ needs.rust-metadata.outputs.lockfile_dir }}

      # sbom-action pins no toolchain: it runs cargo in the project,
      # where a toolchain file would choose one. Install the run's
      # resolved toolchain from outside the checkout, with the scrub
      # the other jobs apply (docs/BRIEF.md Q4), and name it to the
      # SBOM step alone through RUSTUP_TOOLCHAIN.
      - name: 'Install the toolchain'
        shell: bash
        env:
          TOOLCHAIN: ${{ needs.rust-metadata.outputs.toolchain }}
        run: |
          # Install the toolchain
          set -euo pipefail
          cd "$RUNNER_TEMP"
          scrub=(env -u CARGO_REGISTRY_TOKEN
            -u ACTIONS_ID_TOKEN_REQUEST_TOKEN
            -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN
            -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH
            -u GITHUB_STATE -u GITHUB_STEP_SUMMARY)
          while IFS= read -r name; do
            scrub+=(-u "$name")
          done < <(compgen -e | grep -E '^CARGO_REGISTRIES_.+_TOKEN$' \
            || true)
          "${scrub[@]}" rustup toolchain install "$TOOLCHAIN" \
            --profile minimal --no-self-update
          "${scrub[@]}" RUSTUP_TOOLCHAIN="$TOOLCHAIN" cargo --version

      # The Cargo backend describes the graph cargo resolves for
      # path_prefix: a member's own dependencies, or every member's
      # merged at a workspace root. CycloneDX 1.5, the action's default,
      # is the newest cargo-cyclonedx writes and within the 1.4-1.6
      # range in which grype-scan-action trusts a Cargo graph's scopes.
      #
      # untrusted_checkout is 'false' deliberately. The backend runs
      # cargo, and cargo treats a checkout as code: .cargo/config.toml
      # can name a rustc wrapper that cargo metadata executes. Its
      # 'auto' mode classifies fork pull requests as untrusted and
      # skips, losing the SBOM. That guard buys nothing here: the build
      # job has already compiled this same checkout with the same
      # read-only token.
      # The SBOM describes the workspace root when the lane acts on more
      # than one member (workspace, or named packages), so it covers
      # everything the build does, and the selected manifest's own
      # directory for a single package. Cargo reads .cargo/config.toml
      # from its working directory upwards, and the build runs it in
      # path_prefix, so the SBOM's Cargo runs there too whenever
      # path_prefix lies beneath the described directory. Otherwise
      # Cargo runs in the described directory, which then lies in
      # path_prefix, and its upward search still reaches path_prefix.
      - name: 'Choose the SBOM directories'
        id: dirs
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          # yamllint disable-line rule:line-length
          SCAN_DIR: ${{ (inputs.workspace || inputs.packages != '') && needs.rust-metadata.outputs.lockfile_dir || needs.rust-metadata.outputs.manifest_dir }}
        run: |
          # Choose the SBOM directories
          set -euo pipefail
          case "$PATH_PREFIX$SCAN_DIR" in
            *$'\n'* | *$'\r'*)
              echo "::error::path_prefix holds a line break"
              exit 1 ;;
          esac
          scan="$(realpath -e -- "$GITHUB_WORKSPACE/$SCAN_DIR")"
          prefix="$(realpath -e -- "$GITHUB_WORKSPACE/$PATH_PREFIX")"
          cargo_dir=''
          case "$prefix" in
            "$scan"/*) cargo_dir="$PATH_PREFIX" ;;
          esac
          {
            echo "scan=$SCAN_DIR"
            echo "cargo_dir=$cargo_dir"
          } >> "$GITHUB_OUTPUT"
          echo "SBOM of $SCAN_DIR, Cargo run from ${cargo_dir:-$SCAN_DIR}"

      - name: 'Generate SBOM'
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sbom-action@73cdda97132f74a64733b238747d34151444da15  # v0.7.0
        env:
          RUSTUP_TOOLCHAIN: ${{ needs.rust-metadata.outputs.toolchain }}
        with:
          backend: 'cyclonedx'
          # Named rather than left to 'auto', so the lane states the
          # build tool instead of inferring it.
          dependency_manager: 'cargo'
          path_prefix: ${{ steps.dirs.outputs.scan }}
          cargo_working_directory: ${{ steps.dirs.outputs.cargo_dir }}
          # The build's feature selection, so the SBOM describes the
          # graph the build compiled rather than the default features.
          cargo_features: ${{ inputs.features }}
          cargo_all_features: ${{ inputs.all_features }}
          cargo_no_default_features: ${{ inputs.no_default_features }}
          sbom_format: ${{ inputs.sbom_format }}
          include_dev: ${{ inputs.sbom_include_dev }}
          output_directory: ${{ runner.temp }}/sbom
          untrusted_checkout: 'false'

      - name: 'Upload SBOM artefacts'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-files${{ inputs.artefact_suffix }}
          path: ${{ runner.temp }}/sbom/
          retention-days: 45
          if-no-files-found: error

  grype:
    name: 'Grype Audit SBOM'
    needs: sbom
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.sbom.result == 'success' && inputs.grype_enabled }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read  # Maintainer-approved cve-bypass issues
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-files${{ inputs.artefact_suffix }}

      # A merge gates on every finding, whatever it changed: this is
      # the full scan that catches CVEs published since the pull request.
      - name: 'Grype audit SBOM'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@5c81b23afb2ea771b2d247807a12d90783328675  # v0.5.0
        with:
          # The JSON document, or the XML one when that is all there is.
          # yamllint disable-line rule:line-length
          sbom: ${{ inputs.sbom_format == 'xml' && 'sbom-cyclonedx.xml' || 'sbom-cyclonedx.json' }}
          fail-on: ${{ inputs.grype_fail_on }}
          dependency-policy: ${{ inputs.grype_dependency_policy }}
          transitive-fail-on: ${{ inputs.grype_transitive_fail_on }}
          only-fixed: ${{ inputs.grype_only_fixed }}
          # Restore the database but never save one from a merge run:
          # release and merge lanes write no cache (BRIEF D1).
          cache-db: 'restore-only'
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: grype-scan-results${{ inputs.artefact_suffix }}

  # BRIEF Q8. Dry-runs the publish on every merge. On a release merge,
  # the release file's version becomes the release tag the publisher
  # checks every crate version against. No credential reaches this job.
  crate-verify:
    name: 'Verify Crates'
    needs:
      - rust-metadata
      - check-release
      - build
      - tests
      - audit
      - sbom
      - grype
    # Nothing the build covers but this job does not (other targets,
    # binaries, the whole workspace) may fail unnoticed before a
    # release, so every gate must pass or be switched off.
    # yamllint disable rule:line-length
    if: >-
      ${{ !cancelled()
      && needs.rust-metadata.result == 'success'
      && needs.rust-metadata.outputs.publishable_count != '0'
      && needs.check-release.result == 'success'
      && needs.build.result == 'success'
      && (needs.tests.result == 'success'
        || (needs.tests.result == 'skipped' && !inputs.tests_enabled))
      && (needs.audit.result == 'success'
        || (needs.audit.result == 'skipped' && !inputs.audit_enabled))
      && (needs.sbom.result == 'success'
        || (needs.sbom.result == 'skipped' && !inputs.sbom_enabled))
      && (needs.grype.result == 'success'
        || (needs.grype.result == 'skipped'
          && (!inputs.grype_enabled || !inputs.sbom_enabled))) }}
    # yamllint enable rule:line-length
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    outputs:
      crate_name: ${{ steps.verify.outputs.crate_name }}
      crate_sha256: ${{ steps.verify.outputs.crate_sha256 }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ needs.check-release.outputs.sha }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout the merged commit'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ needs.check-release.outputs.sha }}
          persist-credentials: false

      - name: 'Restore the resolved lockfile'
        if: needs.rust-metadata.outputs.lockfile_generated == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.rust-metadata.outputs.lockfile_artefact }}
          path: ${{ needs.rust-metadata.outputs.lockfile_dir }}

      # The publisher installs a minimal toolchain, but a project whose
      # .cargo/config.toml selects a target from its toolchain file
      # needs that target to verify the packaged crate, as may the
      # setup script. Install the file's targets and components for
      # the run's toolchain before both, from outside the checkout
      # and with the environment scrub.
      - name: 'Install the toolchain file targets'
        # yamllint disable-line rule:line-length
        if: needs.rust-metadata.outputs.toolchain_targets != '' || needs.rust-metadata.outputs.toolchain_components != ''
        shell: bash
        env:
          TOOLCHAIN: ${{ needs.rust-metadata.outputs.toolchain }}
          # yamllint disable-line rule:line-length
          COMPONENTS: ${{ needs.rust-metadata.outputs.toolchain_components }}
          TARGETS: ${{ needs.rust-metadata.outputs.toolchain_targets }}
        run: |
          # Install the toolchain file targets
          set -euo pipefail
          args=(toolchain install "$TOOLCHAIN" --profile minimal
            --no-self-update)
          # Comma-separated names rust-metadata already validated.
          IFS=',' read -r -a items <<< "$COMPONENTS"
          for item in ${items[@]+"${items[@]}"}; do
            args+=(--component "$item")
          done
          IFS=',' read -r -a items <<< "$TARGETS"
          for item in ${items[@]+"${items[@]}"}; do
            args+=(--target "$item")
          done
          scrub=(env -u CARGO_REGISTRY_TOKEN
            -u ACTIONS_ID_TOKEN_REQUEST_TOKEN
            -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN
            -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH
            -u GITHUB_STATE -u GITHUB_STEP_SUMMARY)
          while IFS= read -r name; do
            scrub+=(-u "$name")
          done < <(compgen -e | grep -E '^CARGO_REGISTRIES_.+_TOKEN$' \
            || true)
          cd "$RUNNER_TEMP"
          "${scrub[@]}" rustup "${args[@]}"

      # The publisher takes no setup_script, yet this job compiles the
      # packaged crates. Run the script here with the checks and the
      # environment scrub the actions apply, and with the run's
      # toolchain installed and selected, since it may call cargo.
      - name: 'Run the setup script'
        if: inputs.setup_script != ''
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          SETUP_SCRIPT: ${{ inputs.setup_script }}
          RUSTUP_TOOLCHAIN: ${{ needs.rust-metadata.outputs.toolchain }}
        run: |
          # Run the setup script
          set -euo pipefail
          workspace="$(realpath -e -- "$GITHUB_WORKSPACE")"
          project="$(realpath -e -- "$workspace/$PATH_PREFIX")"
          script="$project/$SETUP_SCRIPT"
          case "$SETUP_SCRIPT" in
            /*)
              echo "::error::setup_script must be a relative path"
              exit 1 ;;
          esac
          if [ -L "$script" ] || [ ! -f "$script" ]; then
            echo "::error::setup_script does not name a regular file"
            exit 1
          fi
          script="$(realpath -e -- "$script")"
          # The project must sit inside the workspace, and the script
          # inside the project the lane acts on, as the actions require.
          case "$project/" in
            "$workspace"/*) ;;
            *)
              echo "::error::path_prefix must stay inside the workspace"
              exit 1 ;;
          esac
          case "$script" in
            "$project"/*) ;;
            *)
              echo "::error::setup_script must stay inside path_prefix"
              exit 1 ;;
          esac
          scrub=(env -u CARGO_REGISTRY_TOKEN
            -u ACTIONS_ID_TOKEN_REQUEST_TOKEN
            -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN
            -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH
            -u GITHUB_STATE -u GITHUB_STEP_SUMMARY)
          while IFS= read -r name; do
            scrub+=(-u "$name")
          done < <(compgen -e | grep -E '^CARGO_REGISTRIES_.+_TOKEN$' \
            || true)
          # From outside the checkout, so no project configuration
          # applies (docs/BRIEF.md Q4). The publisher finds it later.
          (cd "$RUNNER_TEMP" && "${scrub[@]}" rustup toolchain install \
            "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update)
          cd "$project"
          "${scrub[@]}" bash "$script"

      - name: 'Verify crates'
        id: verify
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/rust-crate-publish-action@10eccc2817792efe202fca20fca72ae34ef8e749  # v0.3.0
        with:
          path_prefix: ${{ inputs.path_prefix }}
          manifest_path: ${{ inputs.manifest_path }}
          workspace: ${{ inputs.workspace }}
          packages: ${{ inputs.packages }}
          exclude: ${{ inputs.exclude }}
          toolchain: ${{ needs.rust-metadata.outputs.toolchain }}
          # The publisher's version check, not the git tag's name.
          # yamllint disable-line rule:line-length
          release_tag: ${{ needs.check-release.outputs.has_release == 'true' && format('v{0}', needs.check-release.outputs.version) || '' }}
          # yamllint disable-line rule:line-length
          semver_checks: ${{ inputs.semver_checks && needs.check-release.outputs.has_release == 'true' }}
          dry_run: 'true'

  # BRIEF Q9. The only job holding a crates.io credential, minted
  # through Trusted Publishing for this run. It runs no crate code: the
  # publisher repackages without building and uploads only an archive
  # identical to the one crate-verify compiled.
  publish:
    name: 'Publish to crates.io'
    needs:
      - rust-metadata
      - check-release
      - crate-verify
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && inputs.publish_enabled && !inputs.dry_run && needs.check-release.outputs.has_release == 'true' && needs.crate-verify.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.publish_environment }}
    permissions:
      contents: read
      id-token: write  # crates.io Trusted Publishing
    timeout-minutes: 15
    outputs:
      publish_status: ${{ steps.publish.outputs.publish_status }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ needs.check-release.outputs.sha }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout the merged commit'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ needs.check-release.outputs.sha }}
          persist-credentials: false

      - name: 'Restore the resolved lockfile'
        if: needs.rust-metadata.outputs.lockfile_generated == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.rust-metadata.outputs.lockfile_artefact }}
          path: ${{ needs.rust-metadata.outputs.lockfile_dir }}

      # Exchanges this job's OIDC token for a short-lived crates.io
      # token, which the action's post step revokes.
      - name: 'Authenticate to crates.io'
        id: auth
        # yamllint disable-line rule:line-length
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6

      - name: 'Publish crates'
        id: publish
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/rust-crate-publish-action@10eccc2817792efe202fca20fca72ae34ef8e749  # v0.3.0
        with:
          path_prefix: ${{ inputs.path_prefix }}
          manifest_path: ${{ inputs.manifest_path }}
          workspace: ${{ inputs.workspace }}
          packages: ${{ inputs.packages }}
          exclude: ${{ inputs.exclude }}
          # The archive digest depends on the Cargo that packages it,
          # so publish with the toolchain crate-verify used.
          toolchain: ${{ needs.rust-metadata.outputs.toolchain }}
          release_tag: v${{ needs.check-release.outputs.version }}
          registry_token: ${{ steps.auth.outputs.token }}
          expected_sha256: ${{ needs.crate-verify.outputs.crate_sha256 }}

  # Records the release in git once the crates are live. A tag that
  # GITHUB_TOKEN creates starts no workflow, so this never sets off a
  # tag-push release lane as well. The tag is lightweight and unsigned:
  # projects that need signed tags (Gerrit projects, for one) set
  # create_tag to false and tag through their own release process.
  tag:
    name: 'Tag the Release'
    needs:
      - rust-metadata
      - check-release
      - build
      - tests
      - audit
      - sbom
      - grype
      - crate-verify
      - publish
    # A tag is permanent, so it needs verified crates (or none to
    # verify), every gate passed or switched off, and the publish done
    # or switched off.
    # yamllint disable rule:line-length
    if: >-
      ${{ !cancelled() && inputs.create_tag && !inputs.dry_run
      && needs.check-release.outputs.has_release == 'true'
      && needs.build.result == 'success'
      && (needs.tests.result == 'success'
        || (needs.tests.result == 'skipped' && !inputs.tests_enabled))
      && (needs.audit.result == 'success'
        || (needs.audit.result == 'skipped' && !inputs.audit_enabled))
      && (needs.sbom.result == 'success'
        || (needs.sbom.result == 'skipped' && !inputs.sbom_enabled))
      && (needs.grype.result == 'success'
        || (needs.grype.result == 'skipped'
          && (!inputs.grype_enabled || !inputs.sbom_enabled)))
      && (needs.crate-verify.result == 'success'
        || (needs.crate-verify.result == 'skipped'
          && needs.rust-metadata.outputs.publishable_count == '0'))
      && (needs.publish.result == 'success'
        || (needs.publish.result == 'skipped'
          && (!inputs.publish_enabled
            || needs.rust-metadata.outputs.publishable_count == '0'))) }}
    # yamllint enable rule:line-length
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Create the release tag
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Idempotent: a re-run finds the tag on the same commit and
      # succeeds; a tag on another commit fails rather than moving.
      - name: 'Create the tag'
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
          TAG: ${{ needs.check-release.outputs.tag }}
          SHA: ${{ needs.check-release.outputs.sha }}
        run: |
          # Create the tag
          set -euo pipefail
          if existing="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object.type + " " + .object.sha' 2> /dev/null)"; then
            target="${existing#* }"
            if [ "${existing%% *}" = 'tag' ]; then
              target="$(gh api "repos/$REPOSITORY/git/tags/$target" \
                --jq .object.sha)"
            fi
            if [ "$target" != "$SHA" ]; then
              echo "::error::$TAG already exists on $target, not $SHA"
              exit 1
            fi
            echo "$TAG already exists on $SHA ✅"
          else
            gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$SHA" > /dev/null
            echo "Created $TAG on $SHA ✅"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
